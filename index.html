#dtip{position:fixed;z-index:40;background:#282828;color:#fff;padding:3px 9px;border-radius:6px;font-size:12px;pointer-events:none}
.hd{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;touch-action:none;z-index:2}.hd.l{left:0}.hd.r{right:0}.hd:hover{background:rgba(255,255,255,.5)}
.tr{position:absolute;top:2px;height:26px;background:#2e9e4f;color:#fff;font-style:normal;font-weight:700;text-align:center;line-height:26px;border-radius:13px;z-index:2;pointer-events:none;box-shadow:0 0 0 2px #fff}
.g label{min-width:0}.g input:not([type=checkbox]),.g select{width:100%;min-width:0}
.fitic{display:inline-block;width:17px;height:17px;margin-right:5px;color:var(--grey);vertical-align:middle}.hoseic{display:inline-block;width:18px;height:9px;margin-right:5px;color:var(--grey);vertical-align:middle}
.trc{display:inline-block;background:#2e9e4f;color:#fff;border-radius:10px;padding:0 7px;font-weight:700;margin-left:6px}
.tf{font-size:11px;color:var(--grey);display:inline-flex;gap:3px;align-items:center;margin-left:8px;max-width:120px;line-height:1.1}
.wt input:not([type=checkbox]){padding:3px 5px}

.box h2{margin:0 0 10px;font-size:17px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}

.bt{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.bt .sp{flex:1}
#toast .lk{color:#8cc8ff}

header .hl .r1{justify-content:space-between}header .hl .hwho{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;color:var(--bg);font-size:13px}
header .hl .hu{flex:none}
header .hl .ha{flex:none}

header .simb b{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .hg>*{flex:none}header .hg>#who,header .hg>.simb{flex:0 1 auto}
#bwr,#bpn{display:none!important}

h":"Zmiany","Danish":"Ændringer","Norwegian":"Endringer"},"No event.":{"French":"Aucun événement.","German":"Kein Ereignis.","Spanish":"Ningún evento.","Italian":"Nessun evento.","Dutch":"Geen gebeurtenis.","Portuguese":"Nenhum evento.","Polish":"Brak zdarzeń.","Danish":"Ingen hændelse.","Norwegian":"Ingen hendelse."},"Load older events":{"French":"Charger les événements plus anciens","German":"Ältere Ereignisse laden","Spanish":"Cargar eventos anteriores","Italian":"Carica eventi meno recenti","Dutch":"Oudere gebeurtenissen laden","Portuguese":"Carregar eventos mais antigos","Polish":"Załaduj starsze zdarzenia","Danish":"Indlæs ældre hændelser","Norwegian":"Last inn eldre hendelser"},"Projects of your entity (Project owner) that contain no asset yet. Click a project to open it and add assets.":{"French":"Projets de votre entité (propriétaire du projet) qui ne contiennent encore aucun asset. Cliquez sur un projet pour l’ouvrir et ajouter des assets.","German":"Projekte Ihrer Entität (Projekteigentümer), die noch kein Asset enthalten. Klicken Sie auf ein Projekt, um es zu öffnen und Assets hinzuzufügen.","Spanish":"Proyectos de su entidad (propietario del proyecto) que aún no contienen ningún asset. Haga clic en un proyecto para abrirlo y añadir assets.","Italian":"Progetti della tua entità (proprietario del progetto) che non contengono ancora alcun asset. Fai clic su un progetto per aprirlo e aggiungere asset.","Dutch":"Projecten van uw entiteit (projecteigenaar) die nog geen asset bevatten. Klik op een project om het te openen en assets toe te voegen.","Portuguese":"Projetos da sua entidade (proprietário do projeto) que ainda não contêm nenhum asset. Clique num projeto para o abrir e adicionar assets.","Polish":"Projekty Twojego podmiotu (właściciel projektu), które nie zawierają jeszcze żadnego assetu. Kliknij projekt, aby go otworzyć i dodać assety.","Danish":"Projekter i din enhed (projektejer), der endnu ikke indeholder noget asset. Klik på et projekt for at åbne det og tilføje assets.","Norwegian":"Prosjekter i din enhet (prosjekteier) som ennå ikke inneholder noe asset. Klikk på et prosjekt for å åpne det og legge til assets."},"None.":{"French":"Aucun.","German":"Keine.","Spanish":"Ninguno.","Italian":"Nessuno.","Dutch":"Geen.","Portuguese":"Nenhum.","Polish":"Brak.","Danish":"Ingen.","Norwegian":"Ingen."},"Assets that are on no project today and whose previous project is a Rental without confirmed return to the workshop. “Returned to…” is the workshop chosen with the End date ✓ in the project. Click the house to confirm the return. Nothing is applied until you click Save.":{"French":"Assets qui ne sont sur aucun projet aujourd’hui et dont le projet précédent est un Rental sans retour atelier confirmé. « Retourné à… » est l’atelier choisi avec la date de fin ✓ dans le projet. Cliquez sur la maison pour confirmer le retour. Rien n’est appliqué tant que vous ne cliquez pas sur Enregistrer.","German":"Assets, die heute in keinem Projekt sind und deren vorheriges Projekt ein Rental ohne bestätigte Rückgabe an die Werkstatt ist. „Zurückgegeben an…“ ist die mit dem Enddatum ✓ im Projekt gewählte Werkstatt. Klicken Sie auf das Haus, um die Rückgabe zu bestätigen. Nichts wird angewendet, bis Sie auf Speichern klicken.","Spanish":"Assets que hoy no están en ningún proyecto y cuyo proyecto anterior es un Rental sin devolución al taller confirmada. «Devuelto a…» es el taller elegido con la fecha de fin ✓ en el proyecto. Haga clic en la casa para confirmar la devolución. No se aplica nada hasta que haga clic en Guardar.","Italian":"Asset che oggi non sono su nessun progetto e il cui progetto precedente è un Rental senza rientro in officina confermato. «Restituito a…» è l’officina scelta con la data di fine ✓ nel progetto. Fai clic sulla casa per confermare il rientro. Nulla viene applicato finché non fai clic su Salva.","Dutch":"Assets die vandaag in geen enkel project zitten en waarvan het vorige project een Rental is zonder bevestigde retour naar de werkplaats. “Teruggebracht naar…” is de werkplaats gekozen met de einddatum ✓ in het project. Klik op het huisje om de retour te bevestigen. Er wordt niets toegepast totdat u op Opslaan klikt.","Portuguese":"Assets que hoje não estão em nenhum projeto e cujo projeto anterior é um Rental sem devolução à oficina confirmada. «Devolvido a…» é a oficina escolhida com a data de fim ✓ no projeto. Clique na casa para confirmar a devolução. Nada é aplicado até clicar em Guardar.","Polish":"Assety, które dziś nie są w żadnym projekcie i których poprzedni projekt jest Rental bez potwierdzonego zwrotu do warsztatu. „Zwrócony do…” to warsztat wybrany przy dacie zakończenia ✓ w projekcie. Kliknij domek, aby potwierdzić zwrot. Nic nie zostanie zastosowane, dopóki nie klikniesz Zapisz.","Danish":"Assets, der i dag ikke er på noget projekt, og hvis forrige projekt er et Rental uden bekræftet returnering til værkstedet. “Returneret til…” er det værksted, der er valgt med slutdatoen ✓ i projektet. Klik på huset for at bekræfte returneringen. Intet anvendes, før du klikker på Gem.","Norwegian":"Assets som i dag ikke er på noe prosjekt, og hvis forrige prosjekt er et Rental uten bekreftet retur til verkstedet. «Returnert til…» er verkstedet valgt med sluttdatoen ✓ i prosjektet. Klikk på huset for å bekrefte returen. Ingenting brukes før du klikker på Lagre."},"Asset model":{"French":"Modèle d’asset","German":"Asset-Modell","Spanish":"Modelo de asset","Italian":"Modello di asset","Dutch":"Assetmodel","Portuguese":"Modelo de asset","Polish":"Model assetu","Danish":"Assetmodel","Norwegian":"Assetmodell"},"Return from…":{"French":"Retour de…","German":"Rückgabe von…","Spanish":"Devolución desde…","Italian":"Rientro da…","Dutch":"Retour van…","Portuguese":"Devolução de…","Polish":"Zwrot z…","Danish":"Returnering fra…","Norwegian":"Retur fra…"},"Returned to…":{"French":"Retourné à…","German":"Zurückgegeben an…","Spanish":"Devuelto a…","Italian":"Restituito a…","Dutch":"Teruggebracht naar…","Portuguese":"Devolvido a…","Polish":"Zwrócony do…","Danish":"Returneret til…","Norwegian":"Returnert til…"},"Returned to the workshop (click to confirm)":{"French":"Retourné à l’atelier (cliquer pour confirmer)","German":"An die Werkstatt zurückgegeben (zum Bestätigen klicken)","Spanish":"Devuelto al taller (clic para confirmar)","Italian":"Restituito all’officina (clic per confermare)","Dutch":"Teruggebracht naar de werkplaats (klik om te bevestigen)","Portuguese":"Devolvido à oficina (clique para confirmar)","Polish":"Zwrócony do warsztatu (kliknij, aby potwierdzić)","Danish":"Returneret til værkstedet (klik for at bekræfte)","Norwegian":"Returnert til verkstedet (klikk for å bekrefte)"},"Nothing to confirm.":{"French":"Rien à confirmer.","German":"Nichts zu bestätigen.","Spanish":"Nada que confirmar.","Italian":"Niente da confermare.","Dutch":"Niets te bevestigen.","Portuguese":"Nada a confirmar.","Polish":"Nic do potwierdzenia.","Danish":"Intet at bekræfte.","Norwegian":"Ingenting å bekrefte."},"{0}: choose the workshop (Returned to…) to confirm the return.":{"French":"{0} : choisissez l’atelier (Retourné à…) pour confirmer le retour.","German":"{0}: Wählen Sie die Werkstatt (Zurückgegeben an…), um die Rückgabe zu bestätigen.","Spanish":"{0}: elija el taller (Devuelto a…) para confirmar la devolución.","Italian":"{0}: scegli l’officina (Restituito a…) per confermare il rientro.","Dutch":"{0}: kies de werkplaats (Teruggebracht naar…) om de retour te bevestigen.","Portuguese":"{0}: escolha a oficina (Devolvido a…) para confirmar a devolução.","Polish":"{0}: wybierz warsztat (Zwrócony do…), aby potwierdzić zwrot.","Danish":"{0}: Vælg værkstedet (Returneret til…) for at bekræfte returneringen.","Norwegian":"{0}: Velg verkstedet (Returnert til…) for å bekrefte returen."},"Modified in the meantime by someone else: data reloaded, please reopen the window.":{"French":"Modifié entre-temps par quelqu’un d’autre : données rechargées, veuillez rouvrir la fenêtre.","German":"Zwischenzeitlich von jemand anderem geändert: Daten neu geladen, bitte öffnen Sie das Fenster erneut.","Spanish":"Modificado entretanto por otra persona: datos recargados, vuelva a abrir la ventana.","Italian":"Modificato nel frattempo da qualcun altro: dati ricaricati, riapri la finestra.","Dutch":"Intussen door iemand anders gewijzigd: gegevens opnieuw geladen, open het venster opnieuw.","Portuguese":"Modificado entretanto por outra pessoa: dados recarregados, reabra a janela.","Polish":"Zmodyfikowane w międzyczasie przez kogoś innego: dane przeładowane, otwórz okno ponownie.","Danish":"Ændret i mellemtiden af en anden: data genindlæst, åbn vinduet igen.","Norwegian":"Endret i mellomtiden av noen andre: data lastet inn på nytt, åpne vinduet igjen."},"Pages":{"French":"Pages","German":"Seiten","Spanish":"Páginas","Italian":"Pagine","Dutch":"Pagina’s","Portuguese":"Páginas","Polish":"Strony","Danish":"Sider","Norwegian":"Sider"},"Gantt page":{"French":"Page Gantt","German":"Gantt-Seite","Spanish":"Página Gantt","Italian":"Pagina Gantt","Dutch":"Gantt-pagina","Portuguese":"Página Gantt","Polish":"Strona Gantt","Danish":"Gantt-side","Norwegian":"Gantt-side"},"KPIs page":{"French":"Page KPIs","German":"KPI-Seite","Spanish":"Página KPIs","Italian":"Pagina KPI","Dutch":"KPI-pagina","Portuguese":"Página KPIs","Polish":"Strona KPI","Danish":"KPI-side","Norwegian":"KPI-side"},"Projects page":{"French":"Page Projets","German":"Projektseite","Spanish":"Página Proyectos","Italian":"Pagina Progetti","Dutch":"Projectenpagina","Portuguese":"Página Projetos","Polish":"Strona Projekty","Danish":"Projektside","Norwegian":"Prosjektside"},"Dashboard page":{"French":"Page Tableau de bord","German":"Dashboard-Seite","Spanish":"Página Panel de control","Italian":"Pagina Dashboard","Dutch":"Dashboardpagina","Portuguese":"Página Painel","Polish":"Strona Panel","Danish":"Dashboard-side","Norwegian":"Dashbord-side"},"Events history page":{"French":"Page Historique des é et","German":"Projekttyp","Spanish":"Tipo de proyecto","Italian":"Tipo di progetto","Dutch":"Projecttype","Portuguese":"Tipo de projeto","Polish":"Typ projektu","Danish":"Projekttype","Norwegian":"Prosjekttype"},"Hose model":{"French":"Modèle de Hose","German":"Hose-Modell","Spanish":"Modelo de Hose","Italian":"Modello di Hose","Dutch":"Hose-model","Portuguese":"Modelo de Hose","Polish":"Model Hose","Danish":"Hose-model","Norwegian":"Hose-modell"},"Fitting model":{"French":"Modèle de Fitting","German":"Fitting-Modell","Spanish":"Modelo de Fitting","Italian":"Modello di Fitting","Dutch":"Fitting-model","Portuguese":"Modelo de Fitting","Polish":"Model Fitting","Danish":"Fitting-model","Norwegian":"Fitting-modell"},"Workshop (Maintenance / In production location)":{"French":"Atelier (lieu Maintenance / In production)","German":"Werkstatt (Standort Maintenance / In production)","Spanish":"Taller (ubicación Maintenance / In production)","Italian":"Officina (luogo Maintenance / In production)","Dutch":"Werkplaats (locatie Maintenance / In production)","Portuguese":"Oficina (local Maintenance / In production)","Polish":"Warsztat (lokalizacja Maintenance / In production)","Danish":"Værksted (placering Maintenance / In production)","Norwegian":"Verksted (plassering Maintenance / In production)"},"Entity (Owner)":{"French":"Entité (propriétaire)","German":"Entität (Eigentümer)","Spanish":"Entidad (propietario)","Italian":"Entità (proprietario)","Dutch":"Entiteit (eigenaar)","Portuguese":"Entidade (proprietário)","Polish":"Podmiot (właściciel)","Danish":"Enhed (ejer)","Norwegian":"Enhet (eier)"},"{4} used":{"French":"{4} utilisé(s)","German":"{4} verwendet","Spanish":"{4} usado(s)","Italian":"{4} usato/i","Dutch":"{4} gebruikt","Portuguese":"{4} usado(s)","Polish":"{4} użyto","Danish":"{4} brugt","Norwegian":"{4} brukt"},"Delete":{"French":"Supprimer","German":"Löschen","Spanish":"Eliminar","Italian":"Elimina","Dutch":"Verwijderen","Portuguese":"Eliminar","Polish":"Usuń","Danish":"Slet","Norwegian":"Slett"},"In use: disable it instead":{"French":"Utilisé : désactivez-le plutôt","German":"In Verwendung: stattdessen deaktivieren","Spanish":"En uso: desactívelo en su lugar","Italian":"In uso: disattivalo invece","Dutch":"In gebruik: deactiveer het in plaats daarvan","Portuguese":"Em uso: desative-o em vez disso","Polish":"W użyciu: zamiast tego wyłącz","Danish":"I brug: deaktivér den i stedet","Norwegian":"I bruk: deaktiver den i stedet"},"Used by application rules":{"French":"Utilisé par les règles de l’application","German":"Von Anwendungsregeln verwendet","Spanish":"Usado por las reglas de la aplicación","Italian":"Usato dalle regole dell’applicazione","Dutch":"Gebruikt door applicatieregels","Portuguese":"Usado pelas regras da aplicação","Polish":"Używane przez reguły aplikacji","Danish":"Bruges af applikationsregler","Norwegian":"Brukes av applikasjonsregler"},"New item…":{"French":"Nouvel élément…","German":"Neuer Eintrag…","Spanish":"Nuevo elemento…","Italian":"Nuovo elemento…","Dutch":"Nieuw item…","Portuguese":"Novo item…","Polish":"Nowa pozycja…","Danish":"Nyt element…","Norwegian":"Nytt element…"},"Order":{"French":"Ordre","German":"Reihenfolge","Spanish":"Orden","Italian":"Ordine","Dutch":"Volgorde","Portuguese":"Ordem","Polish":"Kolejność","Danish":"Rækkefølge","Norwegian":"Rekkefølge"},"Value":{"French":"Valeur","German":"Wert","Spanish":"Valor","Italian":"Valore","Dutch":"Waarde","Portuguese":"Valor","Polish":"Wartość","Danish":"Værdi","Norwegian":"Verdi"},"Usage":{"French":"Utilisation","German":"Verwendung","Spanish":"Uso","Italian":"Utilizzo","Dutch":"Gebruik","Portuguese":"Utilização","Polish":"Użycie","Danish":"Brug","Norwegian":"Bruk"},"In the drop-down":{"French":"Dans la liste déroulante","German":"In der Dropdown-Liste","Spanish":"En la lista desplegable","Italian":"Nell’elenco a discesa","Dutch":"In de keuzelijst","Portuguese":"Na lista pendente","Polish":"Na liście rozwijanej","Danish":"I rullelisten","Norwegian":"I nedtrekkslisten"},"A value can be deleted only if nothing uses it. Otherwise disable it: it stays visible on the objects that use it but can no longer be chosen. Renaming a value also updates the objects that use it. Changes are saved immediately.":{"French":"Une valeur ne peut être supprimée que si rien ne l’utilise. Sinon, désactivez-la : elle reste visible sur les objets qui l’utilisent mais ne peut plus être choisie. Renommer une valeur met aussi à jour les objets qui l’utilisent. Les modifications sont enregistrées immédiatement.","German":"Ein Wert kann nur gelöscht werden, wenn ihn nichts verwendet. Andernfalls deaktivieren Sie ihn: Er bleibt bei den Objekten sichtbar, die ihn verwenden, kann aber nicht mehr ausgewählt werden. Das Umbenennen eines Werts aktualisiert auch die Objekte, die ihn verwenden. Änderungen werden sofort gespeichert.","Spanish":"Un valor solo se puede eliminar si nada lo usa. De lo contrario, desactívelo: sigue visible en los objetos que lo usan pero ya no se puede elegir. Renombrar un valor también actualiza los objetos que lo usan. Los cambios se guardan inmediatamente.","Italian":"Un valore può essere eliminato solo se nulla lo usa. Altrimenti disattivalo: resta visibile sugli oggetti che lo usano ma non può più essere scelto. Rinominare un valore aggiorna anche gli oggetti che lo usano. Le modifiche vengono salvate immediatamente.","Dutch":"Een waarde kan alleen worden verwijderd als niets haar gebruikt. Deactiveer haar anders: ze blijft zichtbaar bij de objecten die haar gebruiken maar kan niet meer worden gekozen. Een waarde hernoemen werkt ook de objecten bij die haar gebruiken. Wijzigingen worden direct opgeslagen.","Portuguese":"Um valor só pode ser eliminado se nada o utilizar. Caso contrário, desative-o: continua visível nos objetos que o utilizam mas já não pode ser escolhido. Renomear um valor também atualiza os objetos que o utilizam. As alterações são guardadas imediatamente.","Polish":"Wartość można usunąć tylko wtedy, gdy nic jej nie używa. W przeciwnym razie wyłącz ją: pozostaje widoczna w obiektach, które jej używają, ale nie można jej już wybrać. Zmiana nazwy wartości aktualizuje także obiekty, które jej używają. Zmiany są zapisywane natychmiast.","Danish":"En værdi kan kun slettes, hvis intet bruger den. Ellers skal du deaktivere den: Den forbliver synlig på de objekter, der bruger den, men kan ikke længere vælges. Omdøbning af en værdi opdaterer også de objekter, der bruger den. Ændringer gemmes med det samme.","Norwegian":"En verdi kan bare slettes hvis ingenting bruker den. Ellers må du deaktivere den: Den forblir synlig på objektene som bruker den, men kan ikke lenger velges. Omdøping av en verdi oppdaterer også objektene som bruker den. Endringer lagres umiddelbart."},"No item.":{"French":"Aucun élément.","German":"Kein Eintrag.","Spanish":"Ningún elemento.","Italian":"Nessun elemento.","Dutch":"Geen item.","Portuguese":"Nenhum item.","Polish":"Brak pozycji.","Danish":"Intet element.","Norwegian":"Ingen element."},"This value already exists.":{"French":"Cette valeur existe déjà.","German":"Dieser Wert existiert bereits.","Spanish":"Este valor ya existe.","Italian":"Questo valore esiste già.","Dutch":"Deze waarde bestaat al.","Portuguese":"Este valor já existe.","Polish":"Ta wartość już istnieje.","Danish":"Denne værdi findes allerede.","Norwegian":"Denne verdien finnes allerede."},"This value is used: disable it instead.":{"French":"Cette valeur est utilisée : désactivez-la plutôt.","German":"Dieser Wert wird verwendet: stattdessen deaktivieren.","Spanish":"Este valor se usa: desactívelo en su lugar.","Italian":"Questo valore è in uso: disattivalo invece.","Dutch":"Deze waarde wordt gebruikt: deactiveer haar in plaats daarvan.","Portuguese":"Este valor está em uso: desative-o em vez disso.","Polish":"Ta wartość jest używana: zamiast tego wyłącz ją.","Danish":"Denne værdi bruges: Deaktivér den i stedet.","Norwegian":"Denne verdien er i bruk: deaktiver den i stedet."},"The value cannot be empty.":{"French":"La valeur ne peut pas être vide.","German":"Der Wert darf nicht leer sein.","Spanish":"El valor no puede estar vacío.","Italian":"Il valore non può essere vuoto.","Dutch":"De waarde mag niet leeg zijn.","Portuguese":"O valor não pode estar vazio.","Polish":"Wartość nie może być pusta.","Danish":"Værdien må ikke være tom.","Norwegian":"Verdien kan ikke være tom."},"Enter a value.":{"French":"Saisissez une valeur.","German":"Geben Sie einen Wert ein.","Spanish":"Introduzca un valor.","Italian":"Inserisci un valore.","Dutch":"Voer een waarde in.","Portuguese":"Introduza um valor.","Polish":"Wprowadź wartość.","Danish":"Indtast en værdi.","Norwegian":"Skriv inn en verdi."},"Added.":{"French":"Ajouté.","German":"Hinzugefügt.","Spanish":"Añadido.","Italian":"Aggiunto.","Dutch":"Toegevoegd.","Portuguese":"Adicionado.","Polish":"Dodano.","Danish":"Tilføjet.","Norwegian":"Lagt til."},"Delete this value?":{"French":"Supprimer cette valeur ?","German":"Diesen Wert löschen?","Spanish":"¿Eliminar este valor?","Italian":"Eliminare questo valore?","Dutch":"Deze waarde verwijderen?","Portuguese":"Eliminar este valor?","Polish":"Usunąć tę wartość?","Danish":"Slet denne værdi?","Norwegian":"Slette denne verdien?"},"Deleted.":{"French":"Supprimé.","German":"Gelöscht.","Spanish":"Eliminado.","Italian":"Eliminato.","Dutch":"Verwijderd.","Portuguese":"Eliminado.","Polish":"Usunięto.","Danish":"Slettet.","Norwegian":"Slettet."},"Set password":{"French":"Définir le mot de passe","German":"Passwort festlegen","Spanish":"Definir contraseña","Italian":"Imposta password","Dutch":"Wachtwoord instellen","Portuguese":"Definir palavra-passe","Polish":"Ustaw hasło","Danish":"Angiv adgangskode","Norwegian":"Angi passord"},"Create login":{"French":"Créer l’accès","German":"Zugang erstellen","Spanish":"Crear acceso","Italian":"Crea accesso","Dutch":"Login aanmaken","Portuguese":"Criar acesso","Polish":"Utwórz login","Danish":"Opret login","Norwegian":"Opprett pålogging"},"Initial password (min. 8)":{"French":"Mot de passe initial (8 min.)","German":"Anfangspasswort (mind. 8)","Spanish":"Contraseña inicial (mín. 8)","Italian":"Password iniziale (min. 8)","Dutch":"Beginwachtwoord (min. 8)","Portuguese":"Palavra-passe inicial (mín. 8)","Polish":"Hasło początkowe (min. 8)","Danish":"Startadgangskode (min. 8)","Norwegian":"Startpassord (min. 8)"},"New user (creates the profile and the login):":{"French":"Nouvel utilisateur (crée le profil et l’accès) :","German":"Neuer Benutzer (erstellt Profil und Zugang):","Spanish":"Nuevo usuario (crea el perfil y el acceso):","Italian":"Nuovo utente (crea il profilo e l’accesso):","Dutch":"Nieuwe gebruiker (maakt het profiel en de login aan):","Portuguese":"Novo utilizador (cria o perfil e o acesso):","Polish":"Nowy użytkownik (tworzy profil i login):","Danish":"Ny bruger (opretter profilen og login):","Norwegian":"Ny bruker (oppretter profilen og påloggingen):"},"Create user":{"French":"Créer l’utilisateur","German":"Benutzer erstellen","Spanish":"Crear usuario","Italian":"Crea utente","Dutch":"Gebruiker aanmaken","Portuguese":"Criar utilizador","Polish":"Utwórz użytkownika","Danish":"Opret bruger","Norwegian":"Opprett bruker"},"Email":{"French":"E-mail","German":"E-Mail","Spanish":"Correo electrónico","Italian":"E-mail","Dutch":"E-mail","Portuguese":"E-mail","Polish":"E-mail","Danish":"E-mail","Norwegian":"E-post"},"Profile":{"French":"Profil","German":"Profil","Spanish":"Perfil","Italian":"Profilo","Dutch":"Profiel","Portuguese":"Perfil","Polish":"Profil","Danish":"Profil","Norwegian":"Profil"},"Login":{"French":"Accès","German":"Zugang","Spanish":"Acceso","Italian":"Accesso","Dutch":"Login","Portuguese":"Acesso","Polish":"Login","Danish":"Login","Norwegian":"Pålogging"},"Download":{"French":"Télécharger","German":"Herunterladen","Spanish":"Descargar","Italian":"Scarica","Dutch":"Downloaden","Portuguese":"Transferir","Polish":"Pobierz","Danish":"Download","Norwegian":"Last ned"},"Export all data to Excel":{"French":"Exporter toutes les données vers Excel","German":"Alle Daten nach Excel exportieren","Spanish":"Exportar todos los datos a Excel","Italian":"Esporta tutti i dati in Excel","Dutch":"Alle gegevens naar Excel exporteren","Portuguese":"Exportar todos os dados para Excel","Polish":"Eksportuj wszystkie dane do Excela","Danish":"Eksportér alle data til Excel","Norwegian":"Eksporter alle data til Excel"},"The Excel library is loaded only when you click the button (internet access required). Personal preferences (column widths…) are not exported.":{"French":"La bibliothèque Excel n’est chargée qu’au clic sur le bouton (accès internet requis). Les préférences personnelles (largeurs de colonnes…) ne sont pas exportées.","German":"Die Excel-Bibliothek wird erst beim Klick auf die Schaltfläche geladen (Internetzugang erforderlich). Persönliche Einstellungen (Spaltenbreiten …) werden nicht exportiert.","Spanish":"La biblioteca de Excel solo se carga al hacer clic en el botón (se requiere acceso a internet). Las preferencias personales (anchos de columna…) no se exportan.","Italian":"La libreria Excel viene caricata solo quando si fa clic sul pulsante (accesso a internet richiesto). Le preferenze personali (larghezza colonne…) non vengono esportate.","Dutch":"De Excel-bibliotheek wordt pas geladen wanneer u op de knop klikt (internettoegang vereist). Persoonlijke voorkeuren (kolombreedtes…) worden niet geëxporteerd.","Portuguese":"A biblioteca Excel só é carregada quando clica no botão (requer acesso à internet). As preferências pessoais (larguras de colunas…) não são exportadas.","Polish":"Biblioteka Excel jest ładowana dopiero po kliknięciu przycisku (wymagany dostęp do internetu). Preferencje osobiste (szerokości kolumn…) nie są eksportowane.","Danish":"Excel-biblioteket indlæses først, når du klikker på knappen (internetadgang påkrævet). Personlige præferencer (kolonnebredder…) eksporteres ikke.","Norwegian":"Excel-biblioteket lastes først når du klikker på knappen (internettilgang kreves). Personlige innstillinger (kolonnebredder…) eksporteres ikke."},"Tick the fields to display in the asset window, for each asset type. Fields hidden for a type keep their values (nothing is deleted).":{"French":"Cochez les champs à afficher dans la fenêtre asset, pour chaque type d’asset. Les champs masqués pour un type conservent leurs valeurs (rien n’est supprimé).","German":"Haken Sie die Felder an, die im Asset-Fenster angezeigt werden sollen, für jeden Asset-Typ. Für einen Typ ausgeblendete Felder behalten ihre Werte (nichts wird gelöscht).","Spanish":"Marque los campos que se mostrarán en la ventana del asset, para cada tipo de asset. Los campos ocultos para un tipo conservan sus valores (no se elimina nada).","Italian":"Spunta i campi da visualizzare nella finestra dell’asset, per ogni tipo di asset. I campi nascosti per un tipo mantengono i loro valori (nulla viene eliminato).","Dutch":"Vink de velden aan die in het assetvenster worden weergegeven, per assettype. Voor een type verborgen velden behouden hun waarden (er wordt niets verwijderd).","Portuguese":"Marque os campos a apresentar na janela do asset, para cada tipo de asset. Os campos ocultos para um tipo mantêm os seus valores (nada é eliminado).","Polish":"Zaznacz pola wyświetlane w oknie assetu, dla każdego typu assetu. Pola ukryte dla danego typu zachowują swoje wartości (nic nie jest usuwane).","Danish":"Afkryds de felter, der skal vises i asset-vinduet, for hver asset-type. Felter, der er skjult for en type, beholder deres værdier (intet slettes).","Norwegian":"Kryss av for feltene som skal vises i asset-vinduet, for hver asset-type. Felt som er skjult for en type beholder verdiene sine (ingenting slettes)."},"Function":{"French":"Fonction","German":"Funktion","Spanish":"Función","Italian":"Funzione","Dutch":"Functie","Portuguese":"Função","Polish":"Funkcja","Danish":"Funktion","Norwegian":"Funksjon"},"Changes are saved immediately and apply to users on their next action. Everyone can view the planning. Except for “RentPlanner admin”, users can only modify assets (by Owner) and projects (by their project manager’s entity) of their own entity. User management, permissions and drop-down lists are reserved for Administrators.":{"French":"Les modifications sont enregistrées immédiatement et s’appliquent aux utilisateurs à leur prochaine action. Tout le monde peut consulter le planning. Sauf pour « RentPlanner admin », les utilisateurs ne peuvent modifier que les assets (par propriétaire) et les projets (par entité de leur chef de projet) de leur propre entité. La gestion des utilisateurs, des permissions et des listes déroulantes est réservée aux administrateurs.","German":"Änderungen werden sofort gespeichert und gelten für Benutzer bei ihrer nächsten Aktion. Jeder kann die Planung einsehen. Außer „RentPlanner admin“ können Benutzer nur Assets (nach Eigentümer) und Projekte (nach Entität ihres Projektleiters) ihrer eigenen Entität ändern. Benutzerverwaltung, Berechtigungen und Dropdown-Listen sind Administratoren vorbehalten.","Spanish":"Los cambios se guardan inmediatamente y se aplican a los usuarios en su siguiente acción. Todos pueden consultar la planificación. Salvo «RentPlanner admin», los usuarios solo pueden modificar los assets (por propietario) y los proyectos (por entidad de su jefe de proyecto) de su propia entidad. La gestión de usuarios, permisos y listas desplegables está reservada a los administradores.","Italian":"Le modifiche vengono salvate immediatamente e si applicano agli utenti alla loro azione successiva. Tutti possono consultare la pianificazione. Tranne «RentPlanner admin», gli utenti possono modificare solo gli asset (per proprietario) e i progetti (per entità del loro responsabile di progetto) della propria entità. La gestione di utenti, permessi ed elenchi a discesa è riservata agli amministratori.","Dutch":"Wijzigingen worden direct opgeslagen en gelden voor gebruikers bij hun volgende actie. Iedereen kan de planning bekijken. Behalve “RentPlanner admin” kunnen gebruikers alleen assets (per eigenaar) en projecten (per entiteit van hun projectmanager) van hun eigen entiteit wijzigen. Gebruikersbeheer, rechten en keuzelijsten zijn voorbehouden aan beheerders.","Portuguese":"As alterações são guardadas imediatamente e aplicam-se aos utilizadores na sua próxima ação. Todos podem consultar o planeamento. Exceto «RentPlanner admin», os utilizadores só podem modificar assets (por proprietário) e projetos (por entidade do seu gestor de projeto) da sua própria entidade. A gestão de utilizadores, permissões e listas pendentes está reservada aos administradores.","Polish":"Zmiany są zapisywane natychmiast i obowiązują użytkowników przy ich następnej akcji. Każdy może przeglądać planowanie. Z wyjątkiem „RentPlanner admin” użytkownicy mogą modyfikować tylko assety (według właściciela) i projekty (według podmiotu ich kierownika projektu) własnego podmiotu. Zarządzanie użytkownikami, uprawnieniami i listami rozwijanymi jest zarezerwowane dla administratorów.","Danish":"Ændringer gemmes med det samme og gælder for brugerne ved deres næste handling. Alle kan se planlægningen. Bortset fra “RentPlanner admin” kan brugere kun ændre assets (efter ejer) og projekter (efter deres projektleders enhed) i deres egen enhed. Brugeradministration, tilladelser og rullelister er forbeholdt administratorer.","Norwegian":"Endringer lagres umiddelbart og gjelder for brukerne ved neste handling. Alle kan se planleggingen. Bortsett fra «RentPlanner admin» kan brukere bare endre assets (etter eier) og prosjekter (etter enheten til prosjektlederen deres) i sin egen enhet. Brukeradministrasjon, tillatelser og nedtrekkslister er forbeholdt administratorer."},"Administration":{"French":"Administration","German":"Verwaltung","Spanish":"Administración","Italian":"Amministrazione","Dutch":"Beheer","Portuguese":"Administração","Polish":"Administracja","Danish":"Administration","Norwegian":"Administrasjon"},"Lists":{"French":"Listes","German":"Listen","Spanish":"Listas","Italian":"Elenchi","Dutch":"Lijsten","Portuguese":"Listas","Polish":"Listy","Danish":"Lister","Norwegian":"Lister"},"Asset fields":{"French":"Champs asset","German":"Asset-Felder","Spanish":"Campos del asset","Italian":"Campi asset","Dutch":"Assetvelden","Portuguese":"Campos do asset","Polish":"Pola assetu","Danish":"Asset-felter","Norwegian":"Asset-felt"},"Export":{"French":"Export","German":"Export","Spanish":"Exportar","Italian":"Esporta","Dutch":"Export","Portuguese":"Exportar","Polish":"Eksport","Danish":"Eksport","Norwegian":"Eksport"},"You cannot remove your own access or administrator rights.":{"French":"Vous ne pouvez pas retirer votre propre accès ni vos droits d’administrateur.","German":"Sie können Ihren eigenen Zugang oder Ihre Administratorrechte nicht entfernen.","Spanish":"No puede quitarse su propio acceso ni sus derechos de administrador.","Italian":"Non puoi rimuovere il tuo accesso né i tuoi diritti di amministratore.","Dutch":"U kunt uw eigen toegang of beheerdersrechten niet verwijderen.","Portuguese":"Não pode remover o seu próprio acesso nem os seus direitos de administrador.","Polish":"Nie możesz usunąć własnego dostępu ani praw administratora.","Danish":"Du kan ikke fjerne din egen adgang eller dine administratorrettigheder.","Norwegian":"Du kan ikke fjerne din egen tilgang eller dine administratorrettigheter."},"The name is required.":{"French":"Le nom est obligatoire.","German":"Der Name ist erforderlich.","Spanish":"El nombre es obligatorio.","Italian":"Il nome è obbligatorio.","Dutch":"De naam is verplicht.","Portuguese":"O nome é obrigatório.","Polish":"Nazwa jest wymagana.","Danish":"Navnet er påkrævet.","Norwegian":"Navnet er påkrevd."},"Name, email and a password of at least 8 characters are required.":{"French":"Le nom, l’e-mail et un mot de passe d’au moins 8 caractères sont obligatoires.","German":"Name, E-Mail und ein Passwort mit mindestens 8 Zeichen s n Rental il cui rientro in officina non è confermato.","Dutch":"{0}: zijn vorige project ({1}) is een Rental waarvan de retour naar de werkplaats niet is bevestigd.","Portuguese":"{0}: o seu projeto anterior ({1}) é um Rental cuja devolução à oficina não está confirmada.","Polish":"{0}: jego poprzedni projekt ({1}) jest Rental, którego zwrot do warsztatu nie jest potwierdzony.","Danish":"{0}: dets forrige projekt ({1}) er et Rental, hvis returnering til værkstedet ikke er bekræftet.","Norwegian":"{0}: forrige prosjekt ({1}) er et Rental der returen til verkstedet ikke er bekreftet."},"There is no previous project on this asset.":{"French":"Il n’y a pas de projet précédent sur cet asset.","German":"Es gibt kein vorheriges Projekt für dieses Asset.","Spanish":"No hay proyecto anterior en este asset.","Italian":"Non c’è un progetto precedente su questo asset.","Dutch":"Er is geen vorig project voor dit asset.","Portuguese":"Não há projeto anterior neste asset.","Polish":"Brak poprzedniego projektu dla tego assetu.","Danish":"Der er intet forrige projekt på dette asset.","Norwegian":"Det finnes ikke noe forrige prosjekt på dette assetet."},"The previous project is not a Rental project: transfer not possible.":{"French":"Le projet précédent n’est pas un projet Rental : transfert impossible.","German":"Das vorherige Projekt ist kein Rental-Projekt: Übergabe nicht möglich.","Spanish":"El proyecto anterior no es un proyecto Rental: transferencia no posible.","Italian":"Il progetto precedente non è un progetto Rental: trasferimento non possibile.","Dutch":"Het vorige project is geen Rental-project: overdracht niet mogelijk.","Portuguese":"O projeto anterior não é um projeto Rental: transferência não possível.","Polish":"Poprzedni projekt nie jest projektem Rental: transfer niemożliwy.","Danish":"Det forrige projekt er ikke et Rental-projekt: overførsel ikke mulig.","Norwegian":"Forrige prosjekt er ikke et Rental-prosjekt: overføring ikke mulig."},"A return to the workshop is confirmed on the previous project: transfer not possible.":{"French":"Un retour à l’atelier est confirmé sur le projet précédent : transfert impossible.","German":"Im vorherigen Projekt ist eine Rückgabe an die Werkstatt bestätigt: Übergabe nicht möglich.","Spanish":"Hay una devolución al taller confirmada en el proyecto anterior: transferencia no posible.","Italian":"Un rientro in officina è confermato sul progetto precedente: trasferimento non possibile.","Dutch":"Er is een retour naar de werkplaats bevestigd in het vorige project: overdracht niet mogelijk.","Portuguese":"Está confirmada uma devolução à oficina no projeto anterior: transferência não possível.","Polish":"Zwrot do warsztatu jest potwierdzony w poprzednim projekcie: transfer niemożliwy.","Danish":"En returnering til værkstedet er bekræftet på det forrige projekt: overførsel ikke mulig.","Norwegian":"En retur til verkstedet er bekreftet på forrige prosjekt: overføring ikke mulig."},"A return to the workshop is confirmed on this project: transfer to the next project not possible.":{"French":"Un retour à l’atelier est confirmé sur ce projet : transfert vers le projet suivant impossible.","German":"In diesem Projekt ist eine Rückgabe an die Werkstatt bestätigt: Übergabe an das nächste Projekt nicht möglich.","Spanish":"Hay una devolución al taller confirmada en este proyecto: transferencia al siguiente proyecto no posible.","Italian":"Un rientro in officina è confermato su questo progetto: trasferimento al progetto successivo non possibile.","Dutch":"Er is een retour naar de werkplaats bevestigd in dit project: overdracht naar het volgende project niet mogelijk.","Portuguese":"Está confirmada uma devolução à oficina neste projeto: transferência para o projeto seguinte não possível.","Polish":"Zwrot do warsztatu jest potwierdzony w tym projekcie: transfer do następnego projektu niemożliwy.","Danish":"En returnering til værkstedet er bekræftet på dette projekt: overførsel til næste projekt ikke mulig.","Norwegian":"En retur til verkstedet er bekreftet på dette prosjektet: overføring til neste prosjekt ikke mulig."},"There is no upcoming project on this asset.":{"French":"Il n’y a pas de projet à venir sur cet asset.","German":"Es gibt kein kommendes Projekt für dieses Asset.","Spanish":"No hay proyecto próximo en este asset.","Italian":"Non c’è un progetto futuro su questo asset.","Dutch":"Er is geen aankomend project voor dit asset.","Portuguese":"Não há projeto próximo neste asset.","Polish":"Brak nadchodzącego projektu dla tego assetu.","Danish":"Der er intet kommende projekt på dette asset.","Norwegian":"Det finnes ikke noe kommende prosjekt på dette assetet."},"The next project is not a Rental project: transfer not possible.":{"French":"Le projet suivant n’est pas un projet Rental : transfert impossible.","German":"Das nächste Projekt ist kein Rental-Projekt: Übergabe nicht möglich.","Spanish":"El siguiente proyecto no es un proyecto Rental: transferencia no posible.","Italian":"Il progetto successivo non è un progetto Rental: trasferimento non possibile.","Dutch":"Het volgende project is geen Rental-project: overdracht niet mogelijk.","Portuguese":"O projeto seguinte não é um projeto Rental: transferência não possível.","Polish":"Następny projekt nie jest projektem Rental: transfer niemożliwy.","Danish":"Det næste projekt er ikke et Rental-projekt: overførsel ikke mulig.","Norwegian":"Neste prosjekt er ikke et Rental-prosjekt: overføring ikke mulig."},"Choose the workshop where the asset returns. The End date will be confirmed.":{"French":"Choisissez l’atelier où l’asset retourne. La date de fin sera confirmée.","German":"Wählen Sie die Werkstatt, in die das Asset zurückkehrt. Das Enddatum wird bestätigt.","Spanish":"Elija el taller al que vuelve el asset. Se confirmará la fecha de fin.","Italian":"Scegli l’officina in cui l’asset rientra. La data di fine sarà confermata.","Dutch":"Kies de werkplaats waar het asset naartoe terugkeert. De einddatum wordt bevestigd.","Portuguese":"Escolha a oficina para onde o asset regressa. A data de fim será confirmada.","Polish":"Wybierz warsztat, do którego asset wraca. Data zakończenia zostanie potwierdzona.","Danish":"Vælg det værksted, som asset’et returnerer til. Slutdatoen bekræftes.","Norwegian":"Velg verkstedet som assetet returnerer til. Sluttdatoen vil bli bekreftet."},"Workshop":{"French":"Atelier","German":"Werkstatt","Spanish":"Taller","Italian":"Officina","Dutch":"Werkplaats","Portuguese":"Oficina","Polish":"Warsztat","Danish":"Værksted","Norwegian":"Verksted"},"A transfer to the next project exists on this asset: no return to the workshop possible.":{"French":"Un transfert vers le projet suivant existe sur cet asset : retour à l’atelier impossible.","German":"Für dieses Asset existiert eine Übergabe an das nächste Projekt: keine Rückgabe an die Werkstatt möglich.","Spanish":"Existe una transferencia al siguiente proyecto en este asset: devolución al taller no posible.","Italian":"Esiste un trasferimento al progetto successivo su questo asset: rientro in officina non possibile.","Dutch":"Er bestaat een overdracht naar het volgende project voor dit asset: retour naar de werkplaats niet mogelijk.","Portuguese":"Existe uma transferência para o projeto seguinte neste asset: devolução à oficina não possível.","Polish":"Dla tego assetu istnieje transfer do następnego projektu: zwrot do warsztatu niemożliwy.","Danish":"Der findes en overførsel til næste projekt på dette asset: returnering til værkstedet ikke mulig.","Norwegian":"Det finnes en overføring til neste prosjekt på dette assetet: retur til verkstedet ikke mulig."},"Confirm the End date first (✓ on the End date, where you choose the return workshop).":{"French":"Confirmez d’abord la date de fin (✓ sur la date de fin, où vous choisissez l’atelier de retour).","German":"Bestätigen Sie zuerst das Enddatum (✓ am Enddatum, wo Sie die Rückgabewerkstatt wählen).","Spanish":"Confirme primero la fecha de fin (✓ en la fecha de fin, donde elige el taller de devolución).","Italian":"Conferma prima la data di fine (✓ sulla data di fine, dove scegli l’officina di rientro).","Dutch":"Bevestig eerst de einddatum (✓ op de einddatum, waar u de retourwerkplaats kiest).","Portuguese":"Confirme primeiro a data de fim (✓ na data de fim, onde escolhe a oficina de devolução).","Polish":"Najpierw potwierdź datę zakończenia (✓ przy dacie zakończenia, gdzie wybierasz warsztat zwrotu).","Danish":"Bekræft først slutdatoen (✓ ved slutdatoen, hvor du vælger returværkstedet).","Norwegian":"Bekreft sluttdatoen først (✓ på sluttdatoen, der du velger returverkstedet)."},"No return workshop on this line: untick the End date ✓ and tick it again to choose the workshop.":{"French":"Pas d’atelier de retour sur cette ligne : décochez la date de fin ✓ puis cochez-la à nouveau pour choisir l’atelier.","German":"Keine Rückgabewerkstatt in dieser Zeile: Entfernen Sie den Haken ✓ am Enddatum und setzen Sie ihn erneut, um die Werkstatt zu wählen.","Spanish":"Sin taller de devolución en esta línea: desmarque la fecha de fin ✓ y márquela de nuevo para elegir el taller.","Italian":"Nessuna officina di rientro su questa riga: deseleziona la data di fine ✓ e riselezionala per scegliere l’officina.","Dutch":"Geen retourwerkplaats op deze regel: vink de einddatum ✓ uit en weer aan om de werkplaats te kiezen.","Portuguese":"Sem oficina de devolução nesta linha: desmarque a data de fim ✓ e marque-a novamente para escolher a oficina.","Polish":"Brak warsztatu zwrotu w tym wierszu: odznacz datę zakończenia ✓ i zaznacz ją ponownie, aby wybrać warsztat.","Danish":"Intet returværksted på denne linje: Fjern fluebenet ✓ ved slutdatoen, og sæt det igen for at vælge værkstedet.","Norwegian":"Ikke noe returverksted på denne linjen: Fjern haken ✓ på sluttdatoen og sett den på nytt for å velge verkstedet."},"Name and location/client are required.":{"French":"Le nom et le lieu/client sont obligatoires.","German":"Name und Standort/Kunde sind erforderlich.","Spanish":"El nombre y la ubicación/cliente son obligatorios.","Italian":"Nome e luogo/cliente sono obbligatori.","Dutch":"Naam en locatie/klant zijn verplicht.","Portuguese":"O nome e o local/cliente são obrigatórios.","Polish":"Nazwa i lokalizacja/klient są wymagane.","Danish":"Navn og sted/kunde er påkrævet.","Norwegian":"Navn og sted/kunde er påkrevd."},"Choose the workshop in the list.":{"French":"Choisissez l’atelier dans la liste.","German":"Wählen Sie die Werkstatt aus der Liste.","Spanish":"Elija el taller de la lista.","Italian":"Scegli l’officina dall’elenco.","Dutch":"Kies de werkplaats uit de lijst.","Portuguese":"Escolha a oficina na lista.","Polish":"Wybierz warsztat z listy.","Danish":"Vælg værkstedet på listen.","Norwegian":"Velg verkstedet fra listen."},"The delivery date of {0} ({1}) must be after its manufacture date ({2}).":{"French":"La date de livraison de {0} ({1}) doit être postérieure à sa date de fabrication ({2}).","German":"Das Lieferdatum von {0} ({1}) muss nach seinem Herstellungsdatum ({2}) liegen.","Spanish":"La fecha de entrega de {0} ({1}) debe ser posterior a su fecha de fabricación ({2}).","Italian":"La data di consegna di {0} ({1}) deve essere successiva alla sua data di fabbricazione ({2}).","Dutch":"De leveringsdatum van {0} ({1}) moet na zijn productiedatum ({2}) liggen.","Portuguese":"A data de entrega de {0} ({1}) deve ser posterior à sua data de fabrico ({2}).","Polish":"Data dostawy {0} ({1}) musi być późniejsza niż jego data produkcji ({2}).","Danish":"Leveringsdatoen for {0} ({1}) skal ligge efter dets fremstillingsdato ({2}).","Norwegian":"Leveringsdatoen for {0} ({1}) må være etter produksjonsdatoen ({2})."},"{0} has already been on an In production project: it can be produced only once.":{"French":"{0} a déjà été sur un projet In production : il ne peut être produit qu’une fois.","German":"{0} war bereits in einem In-production-Projekt: Es kann nur einmal produziert werden.","Spanish":"{0} ya ha estado en un proyecto In production: solo puede producirse una vez.","Italian":"{0} è già stato su un progetto In production: può essere prodotto una sola volta.","Dutch":"{0} heeft al in een In production-project gezeten: het kan maar één keer worden geproduceerd.","Portuguese":"{0} já esteve num projeto In production: só pode ser produzido uma vez.","Polish":"{0} był już w projekcie In production: może być wyprodukowany tylko raz.","Danish":"{0} har allerede været på et In production-projekt: Det kan kun produceres én gang.","Norwegian":"{0} har allerede vært på et In production-prosjekt: Det kan bare produseres én gang."},"The end date of the In production project ({0}) becomes the manufacture date of {1}: it must be before all its delivery dates.":{"French":"La date de fin du projet In production ({0}) devient la date de fabrication de {1} : elle doit être antérieure à toutes ses dates de livraison.","German":"Das Enddatum des In-production-Projekts ({0}) wird zum Herstellungsdatum von {1}: Es muss vor allen seinen Lieferdaten liegen.","Spanish":"La fecha de fin del proyecto In production ({0}) pasa a ser la fecha de fabricación de {1}: debe ser anterior a todas sus fechas de entrega.","Italian":"La data di fine del progetto In production ({0}) diventa la data di fabbricazione di {1}: deve essere anteriore a tutte le sue date di consegna.","Dutch":"De einddatum van het In production-project ({0}) wordt de productiedatum van {1}: deze moet vóór al zijn leveringsdata liggen.","Portuguese":"A data de fim do projeto In production ({0}) passa a ser a data de fabrico de {1}: deve ser anterior a todas as suas datas de entrega.","Polish":"Data zakończenia projektu In production ({0}) staje się datą produkcji {1}: musi być wcześniejsza niż wszystkie jego daty dostawy.","Danish":"Slutdatoen for In production-projektet ({0}) bliver fremstillingsdatoen for {1}: Den skal ligge før alle dets leveringsdatoer.","Norwegian":"Sluttdatoen for In production-prosjektet ({0}) blir produksjonsdatoen for {1}: Den må være før alle leveringsdatoene."},"Other assets owner: the project name, the commercial area and the project manager are required.":{"French":"Propriétaire des autres assets : le nom du projet, la zone commerciale et le chef de projet sont obligatoires.","German":"Eigentümer weiterer Assets: Projektname, Vertriebsgebiet und Projektleiter sind erforderlich.","Spanish":"Propietario de otros assets: el nombre del proyecto, el área comercial y el jefe de proyecto son obligatorios.","Italian":"Proprietario di altri asset: nome del progetto, area commerciale e responsabile di progetto sono obbligatori.","Dutch":"Eigenaar overige assets: de projectnaam, het commerciële gebied en de projectmanager zijn verplicht.","Portuguese":"Proprietário de outros assets: o nome do projeto, a área comercial e o gestor de projeto são obrigatórios.","Polish":"Właściciel pozostałych assetów: nazwa projektu, obszar handlowy i kierownik projektu są wymagane.","Danish":"Ejer af øvrige assets: Projektnavn, kommercielt område og projektleder er påkrævet.","Norwegian":"Eier av øvrige assets: Prosjektnavn, kommersielt område og prosjektleder er påkrevd."},"Modified in the meantime by someone else: data reloaded, please check and retry.":{"French":"Modifié entre-temps par quelqu’un d’autre : données rechargées, veuillez vérifier et réessayer.","German":"Zwischenzeitlich von jemand anderem geändert: Daten neu geladen, bitte prüfen und erneut versuchen.","Spanish":"Modificado entretanto por otra persona: datos recargados, compruebe e inténtelo de nuevo.","Italian":"Modificato nel frattempo da qualcun altro: dati ricaricati, controlla e riprova.","Dutch":"Intussen door iemand anders gewijzigd: gegevens opnieuw geladen, controleer en probeer opnieuw.","Portuguese":"Modificado entretanto por outra pessoa: dados recarregados, verifique e tente novamente.","Polish":"Zmodyfikowane w międzyczasie przez kogoś innego: dane przeładowane, sprawdź i spróbuj ponownie.","Danish":"Ændret i mellemtiden af en anden: data genindlæst, kontrollér og prøv igen.","Norwegian":"Endret i mellomtiden av noen andre: data lastet inn på nytt, kontroller og prøv igjen."},"Project saved, but the quality audit was not updated:":{"French":"Projet enregistré, mais l’audit qualité n’a pas été mis à jour :","German":"Projekt gespeichert, aber das Qualitätsaudit wurde nicht aktualisiert:","Spanish":"Proyecto guardado, pero la auditoría de calidad no se actualizó:","Italian":"Progetto salvato, ma l’audit qualità non è stato aggiornato:","Dutch":"Project opgeslagen, maar de kwaliteitsaudit is niet bijgewerkt:","Portuguese":"Projeto guardado, mas a auditoria de qualidade não foi atualizada:","Polish":"Projekt zapisany, ale audyt jakości nie został zaktualizowany:","Danish":"Projekt gemt, men kvalitetsauditten blev ikke opdateret:","Norwegian":"Prosjekt lagret, men kvalitetsrevisjonen ble ikke oppdatert:"},"Click a project to open it.":{"French":"Cliquez sur un projet pour l’ouvrir.","German":"Klicken Sie auf ein Projekt, um es zu öffnen.","Spanish":"Haga clic en un proyecto para abrirlo.","Italian":"Fai clic su un progetto per aprirlo.","Dutch":"Klik op een project om het te openen.","Portuguese":"Clique num projeto para o abrir.","Polish":"Kliknij projekt, aby go otworzyć.","Danish":"Klik på et projekt for at åbne det.","Norwegian":"Klikk på et prosjekt for å åpne det."},"Life days exclude the days before the manufacture date, the days after the destruction / sale / loss date. Available = life days neither rented nor in maintenance. ▲▼ = difference in percentage points with the previous column.":{"French":"Les jours de vie excluent les jours avant la date de fabrication et les jours après la date de destruction / vente / perte. Disponible = jours de vie ni loués ni en maintenance. ▲▼ = écart en points de pourcentage avec la colonne précédente.","German":"Lebenstage schließen die Tage vor dem Herstellungsdatum und nach dem Verschrottungs- / Verkaufs- / Verlustdatum aus. Verfügbar = Lebenstage, die weder vermietet noch in Wartung sind. ▲▼ = Differenz in Prozentpunkten zur vorherigen Spalte.","Spanish":"Los días de vida excluyen los días anteriores a la fecha de fabricación y posteriores a la fecha de destrucción / venta / pérdida. Disponible = días de vida ni alquilados ni en mantenimiento. ▲▼ = diferencia en puntos porcentuales con la columna anterior.","Italian":"I giorni di vita escludono i giorni prima della data di fabbricazione e dopo la data di distruzione / vendita / perdita. Disponibile = giorni di vita né noleggiati né in manutenzione. ▲▼ = differenza in punti percentuali rispetto alla colonna precedente.","Dutch":"Levensdagen sluiten de dagen vóór de productiedatum en na de vernietigings- / verkoop- / verliesdatum uit. Beschikbaar = levensdagen die niet verhuurd of in onderhoud zijn. ▲▼ = verschil in procentpunten met de vorige kolom.","Portuguese":"Os dias de vida excluem os dias anteriores à data de fabrico e posteriores à data de destruição / venda / perda. Disponível = dias de vida nem alugados nem em manutenção. ▲▼ = diferença em pontos percentuais face à coluna anterior.","Polish":"Dni życia nie obejmują dni przed datą produkcji ani po dacie zniszczenia / sprzedaży / utraty. Dostępny = dni życia niewynajęte i niebędące w konserwacji. ▲▼ = różnica w punktach procentowych względem poprzedniej kolumny.","Danish":"Levedage udelukker dagene før fremstillingsdatoen og dagene efter destruktions- / salgs- / tabsdatoen. Tilgængelig = levedage, der hverken er udlejet eller i vedligeholdelse. ▲▼ = forskel i procentpoint i forhold til forrige kolonne.","Norwegian":"Levedager utelater dagene før produksjonsdatoen og dagene etter destruksjons- / salgs- / tapsdatoen. Tilgjengelig = levedager som verken er utleid eller i vedlikehold. ▲▼ = forskjell i prosentpoeng fra forrige kolonne."},"Changes are saved immediately. Untick “Active” to remove someone’s access; users cannot be deleted.":{"French":"Les modifications sont enregistrées immédiatement. Décochez « Actif » pour retirer l’accès de quelqu’un ; les utilisateurs ne peuvent pas être supprimés.","German":"Änderungen werden sofort gespeichert. Entfernen Sie den Haken bei „Aktiv“, um jemandem den Zugang zu entziehen; Benutzer können nicht gelöscht werden.","Spanish":"Los cambios se guardan inmediatamente. Desmarque «Activo» para retirar el acceso a alguien; los usuarios no se pueden eliminar.","Italian":"Le modifiche vengono salvate immediatamente. Deseleziona «Attivo» per rimuovere l’accesso a qualcuno; gli utenti non possono essere eliminati.","Dutch":"Wijzigingen worden direct opgeslagen. Vink “Actief” uit om iemands toegang te verwijderen; gebruikers kunnen niet worden verwijderd.","Portuguese":"As alterações são guardadas imediatamente. Desmarque «Ativo» para retirar o acesso a alguém; os utilizadores não podem ser eliminados.","Polish":"Zmiany są zapisywane natychmiast. Odznacz „Aktywny”, aby odebrać komuś dostęp; użytkowników nie można usuwać.","Danish":"Ændringer gemmes med det samme. Fjern markeringen i “Aktiv” for at fjerne nogens adgang; brugere kan ikke slettes.","Norwegian":"Endringer lagres umiddelbart. Fjern haken for «Aktiv» for å fjerne noens tilgang; brukere kan ikke slettes."},"▲ always displayed · ▼ with “Details”":{"French":"▲ toujours affichée · ▼ avec « Détails »","German":"▲ immer angezeigt · ▼ mit „Details“","Spanish":"▲ siempre visible · ▼ con «Detalles»","Italian":"▲ sempre visibile · ▼ con «Dettagli»","Dutch":"▲ altijd weergegeven · ▼ met “Details”","Portuguese":"▲ sempre visível · ▼ com «Detalhes»","Polish":"▲ zawsze wyświetlane · ▼ ze „Szczegółami”","Danish":"▲ altid vist · ▼ med “Detaljer”","Norwegian":"▲ alltid vist · ▼ med «Detaljer»"},"▲ with “Details” · ▼ never displayed":{"French":"▲ avec « Détails » · ▼ jamais affichée","German":"▲ mit „Details“ · ▼ nie angezeigt","Spanish":"▲ con «Detalles» · ▼ nunca visible","Italian":"▲ con «Dettagli» · ▼ mai visibile","Dutch":"▲ met “Details” · ▼ nooit weergegeven","Portuguese":"▲ com «Detalhes» · ▼ nunca visível","Polish":"▲ ze „Szczegółami” · ▼ nigdy niewyświetlane","Danish":"▲ med “Detaljer” · ▼ aldrig vist","Norwegian":"▲ med «Detaljer» · ▼ aldri vist"},"days, ending today":{"French":"jours, jusqu’à aujourd’hui","German":"Tage, bis heute","Spanish":"días, hasta hoy","Italian":"giorni, fino a oggi","Dutch":"dagen, eindigend vandaag","Portuguese":"dias, até hoje","Polish":"dni, do dziś","Danish":"dage, til og med i dag","Norwegian":"dager, til og med i dag"},"to Monday":{"French":"au lundi","German":"bis Montag","Spanish":"al lunes","Italian":"al lunedì","Dutch":"tot maandag","Portuguese":"até segunda-feira","Polish":"do poniedziałku","Danish":"til mandag","Norwegian":"til mandag"},"% of life days":{"French":"% des jours de vie","German":"% der Lebenstage","Spanish":"% de días de vida","Italian":"% dei giorni di vita","Dutch":"% van de levensdagen","Portuguese":"% dos dias de vida","Polish":"% dni życia","Danish":"% af levedage","Norwegian":"% av levedager"},"⚠ Attention":{"French":"⚠ Attention","German":"⚠ Achtung","Spanish":"⚠ Atención","Italian":"⚠ Attenzione","Dutch":"⚠ Let op","Portuguese":"⚠ Atenção","Polish":"⚠ Uwaga","Danish":"⚠ Bemærk","Norwegian":"⚠ Obs"},"not confirmed":{"French":"non confirmé","German":"nicht bestätigt","Spanish":"no confirmado","Italian":"non confermato","Dutch":"niet bevestigd","Portuguese":"não confirmado","Polish":"niepotwierdzony","Danish":"ikke bekræftet","Norwegian":"ikke bekreftet"},"and falls within the next 7 days. Once the End dates have passed, the assets will automatically be considered returned and the project may move to “Closed”.":{"French":"et tombe dans les 7 prochains jours. Une fois les dates de fin passées, les assets seront automatiquement considérés comme retournés et le projet pourra passer à « Closed ».","German":"und fällt in die nächsten 7 Tage. Sobald die Enddaten verstrichen sind, gelten die Assets automatisch als zurückgegeben und das Projekt kann auf „Closed“ wechseln.","Spanish":"y cae dentro de los próximos 7 días. Una vez pasadas las fechas de fin, los assets se considerarán automáticamente devueltos y el proyecto podrá pasar a «Closed».","Italian":"e ricade nei prossimi 7 giorni. Una volta trascorse le date di fine, gli asset saranno considerati automaticamente restituiti e il progetto potrà passare a «Closed».","Dutch":"en valt binnen de komende 7 dagen. Zodra de einddata verstreken zijn, worden de assets automatisch als teruggebracht beschouwd en kan het project naar “Closed” gaan.","Portuguese":"e cai nos próximos 7 dias. Depois de passadas as datas de fim, os assets serão automaticamente considerados devolvidos e o projeto poderá passar a «Closed».","Polish":"i przypada w ciągu najbliższych 7 dni. Po upływie dat zakończenia assety zostaną automatycznie uznane za zwrócone, a projekt może przejść do „Closed”.","Danish":"og falder inden for de næste 7 dage. Når slutdatoerne er passeret, betragtes assets automatisk som returneret, og projektet kan gå til “Closed”.","Norwegian":"og faller innenfor de neste 7 dagene. Når sluttdatoene er passert, regnes assetene automatisk som returnert, og prosjektet kan gå til «Closed»."},"✈︎ Transfer":{"French":"✈︎ Transfert","German":"✈︎ Übergabe","Spanish":"✈︎ Transferencia","Italian":"✈︎ Trasferimento","Dutch":"✈︎ Overdracht","Portuguese":"✈︎ Transferência","Polish":"✈︎ Transfer","Danish":"✈︎ Overførsel","Norwegian":"✈︎ Overføring"},"name, field, value…":{"French":"nom, champ, valeur…","German":"Name, Feld, Wert…","Spanish":"nombre, campo, valor…","Italian":"nome, campo, valore…","Dutch":"naam, veld, waarde…","Portuguese":"nome, campo, valor…","Polish":"nazwa, pole, wartość…","Danish":"navn, felt, værdi…","Norwegian":"navn, felt, verdi…"},"Fixed by its In production project (end date)":{"French":"Fixé par son projet In production (date de fin)","German":"Durch sein In-production-Projekt festgelegt (Enddatum)","Spanish":"Fijado por su proyecto In production (fecha de fin)","Italian":"Fissato dal suo progetto In production (data di fine)","Dutch":"Vastgelegd door zijn In production-project (einddatum)","Portuguese":"Fixado pelo seu projeto In production (data de fim)","Polish":"Ustalone przez jego projekt In production (data zakończenia)","Danish":"Fastsat af dets In production-projekt (slutdato)","Norwegian":"Fastsatt av In production-prosjektet (sluttdato)"},"This user always keeps the RentPlanner admin profile":{"French":"Cet utilisateur conserve toujours le profil RentPlanner admin","German":"Dieser Benutzer behält immer das Profil RentPlanner admin","Spanish":"Este usuario conserva siempre el perfil RentPlanner admin","Italian":"Questo utente mantiene sempre il profilo RentPlanner admin","Dutch":"Deze gebruiker behoudt altijd het profiel RentPlanner admin","Portuguese":"Este utilizador mantém sempre o perfil RentPlanner admin","Polish":"Ten użytkownik zawsze zachowuje profil RentPlanner admin","Danish":"Denne bruger beholder altid profilen RentPlanner admin","Norwegian":"Denne brukeren beholder alltid profilen RentPlanner admin"},"all the data of the application":{"French":"toutes les données de l’application","German":"alle Daten der Anwendung","Spanish":"todos los datos de la aplicación","Italian":"tutti i dati dell’applicazione","Dutch":"alle gegevens van de applicatie","Portuguese":"todos os dados da aplicação","Polish":"wszystkie dane aplikacji","Danish":"alle applikationens data","Norwegian":"alle applikasjonens data"},"in one Excel file: one sheet per table (assets, projects, project asset lines, users, entities, drop-down lists, permissions and the full event log).":{"French":"dans un seul fichier Excel : une feuille par table (assets, projets, lignes d’assets de projet, utilisateurs, entités, listes déroulantes, permissions et journal complet des événements).","German":"in einer Excel-Datei: ein Blatt pro Tabelle (Assets, Projekte, Projekt-Asset-Zeilen, Benutzer, Entitäten, Dropdown-Listen, Berechtigungen und das vollständige Ereignisprotokoll).","Spanish":"en un solo archivo Excel: una hoja por tabla (assets, proyectos, líneas de assets de proyecto, usuarios, entidades, listas desplegables, permisos y el registro completo de eventos).","Italian":"in un unico file Excel: un foglio per tabella (asset, progetti, righe asset dei progetti, utenti, entità, elenchi a discesa, permessi e registro completo degli eventi).","Dutch":"in één Excel-bestand: één blad per tabel (assets, projecten, projectassetregels, gebruikers, entiteiten, keuzelijsten, rechten en het volledige gebeurtenislogboek).","Portuguese":"num único ficheiro Excel: uma folha por tabela (assets, projetos, linhas de assets de projeto, utilizadores, entidades, listas pendentes, permissões e o registo completo de eventos).","Polish":"w jednym pliku Excel: jeden arkusz na tabelę (assety, projekty, wiersze assetów projektów, użytkownicy, podmioty, listy rozwijane, uprawnienia i pełny dziennik zdarzeń).","Danish":"i én Excel-fil: ét ark pr. tabel (assets, projekter, projekt-asset-linjer, brugere, enheder, rullelister, tilladelser og den fulde hændelseslog).","Norwegian":"i én Excel-fil: ett ark per tabell (assets, prosjekter, prosjekt-asset-linjer, brukere, enheter, nedtrekkslister, tillatelser og hele hendelsesloggen)."},"project can contain only one asset: remove the extra assets first.":{"French":"ne peut contenir qu’un seul asset : retirez d’abord les assets en trop.","German":"Projekt kann nur ein Asset enthalten: Entfernen Sie zuerst die überzähligen Assets.","Spanish":"solo puede contener un asset: quite primero los assets sobrantes.","Italian":"può contenere un solo asset: rimuovi prima gli asset in eccesso.","Dutch":"kan maar één asset bevatten: verwijder eerst de overtollige assets.","Portuguese":"só pode conter um asset: remova primeiro os assets a mais.","Polish":"może zawierać tylko jeden asset: najpierw usuń nadmiarowe assety.","Danish":"kan kun indeholde ét asset: Fjern først de overskydende assets.","Norwegian":"kan bare inneholde ett asset: Fjern først de overskytende assetene."},"project can contain only one asset.":{"French":"ne peut contenir qu’un seul asset.","German":"Projekt kann nur ein Asset enthalten.","Spanish":"solo puede contener un asset.","Italian":"può contenere un solo asset.","Dutch":"kan maar één asset bevatten.","Portuguese":"só pode conter um asset.","Polish":"może zawierać tylko jeden asset.","Danish":"kan kun indeholde ét asset.","Norwegian":"kan bare inneholde ett asset."},"is a Rental whose return to the workshop is not confirmed.":{"French":"est un Rental dont le retour à l’atelier n’est pas confirmé.","German":"ist ein Rental, dessen Rückgabe an die Werkstatt nicht bestätigt ist.","Spanish":"es un Rental cuya devolución al taller no está confirmada.","Italian":"è un Rental il cui rientro in officina non è confermato.","Dutch":"is een Rental waarvan de retour naar de werkplaats niet is bevestigd.","Portuguese":"é um Rental cuja devolução à oficina não está confirmada.","Polish":"jest Rental, którego zwrot do warsztatu nie jest potwierdzony.","Danish":"er et Rental, hvis returnering til værkstedet ikke er bekræftet.","Norwegian":"er et Rental der returen til verkstedet ikke er bekreftet."},"cannot be after its End date.":{"French":"ne peut pas être postérieure à sa date de fin.","German":"darf nicht nach seinem Enddatum liegen.","Spanish":"no puede ser posterior a su fecha de fin.","Italian":"non può essere successiva alla sua data di fine.","Dutch":"mag niet na zijn einddatum liggen.","Portuguese":"não pode ser posterior à sua data de fim.","Polish":"nie może być późniejsza niż jego data zakończenia.","Danish":"må ikke ligge efter dets slutdato.","Norwegian":"kan ikke være etter sluttdatoen."},"Translation":{"French":"Traduction","German":"Übersetzung","Spanish":"Traducción","Italian":"Traduzione","Dutch":"Vertaling","Portuguese":"Tradução","Polish":"Tłumaczenie","Danish":"Oversættelse","Norwegian":"Oversettelse"},"Language":{"French":"Langue","German":"Sprache","Spanish":"Idioma","Italian":"Lingua","Dutch":"Taal","Portuguese":"Idioma","Polish":"Język","Danish":"Sprog","Norwegian":"Språk"},"Required":{"French":"Obligatoire","German":"Pflicht","Spanish":"Obligatorio","Italian":"Obbligatorio","Dutch":"Verplicht","Portuguese":"Obrigatório","Polish":"Wymagane","Danish":"Påkrævet","Norwegian":"Påkrevd"},"Displayed":{"French":"Affiché","German":"Angezeigt","Spanish":"Mostrado","Italian":"Visualizzato","Dutch":"Weergegeven","Portuguese":"Apresentado","Polish":"Wyświetlane","Danish":"Vist","Norwegian":"Vist"},"Hidden":{"French":"Masqué","German":"Ausgeblendet","Spanish":"Oculto","Italian":"Nascosto","Dutch":"Verborgen","Portuguese":"Oculto","Polish":"Ukryte","Danish":"Skjult","Norwegian":"Skjult"},"Click once: field displayed (blue). Click twice: displayed and mandatory (red). Click a third time: hidden.":{"French":"Un clic : champ affiché (bleu). Deux clics : affiché et obligatoire (rouge). Trois clics : masqué.","German":"Einmal klicken: Feld angezeigt (blau). Zweimal klicken: angezeigt und Pflicht (rot). Dreimal klicken: ausgeblendet.","Spanish":"Un clic: campo mostrado (azul). Dos clics: mostrado y obligatorio (rojo). Tres clics: oculto.","Italian":"Un clic: campo visualizzato (blu). Due clic: visualizzato e obbligatorio (rosso). Tre clic: nascosto.","Dutch":"Eén klik: veld weergegeven (blauw). Twee klikken: weergegeven en verplicht (rood). Drie klikken: verborgen.","Portuguese":"Um clique: campo apresentado (azul). Dois cliques: apresentado e obrigatório (vermelho). Três cliques: oculto.","Polish":"Jedno kliknięcie: pole wyświetlane (niebieski). Dwa kliknięcia: wyświetlane i wymagane (czerwony). Trzy kliknięcia: ukryte.","Danish":"Ét klik: felt vist (blå). To klik: vist og påkrævet (rød). Tre klik: skjult.","Norwegian":"Ett klikk: felt vist (blå). To klikk: vist og påkrevd (rød). Tre klikk: skjult."},"Search…":{"French":"Rechercher…","German":"Suchen…","Spanish":"Buscar…","Italian":"Cerca…","Dutch":"Zoeken…","Portuguese":"Pesquisar…","Polish":"Szukaj…","Danish":"Søg…","Norwegian":"Søk…"},"Reset":{"French":"Réinitialiser","German":"Zurücksetzen","Spanish":"Restablecer","Italian":"Reimposta","Dutch":"Resetten","Portuguese":"Repor","Polish":"Resetuj","Danish":"Nulstil","Norwegian":"Tilbakestill"},"Translations are used as written here. Leave a cell empty to fall back to English. Editing the English column changes the English text displayed in the application.":{"French":"Les traductions sont utilisées telles qu’écrites ici. Laissez une cellule vide pour revenir à l’anglais. Modifier la colonne anglaise change le texte anglais affiché dans l’application.","German":"Übersetzungen werden so verwendet, wie sie hier stehen. Lassen Sie eine Zelle leer, um auf Englisch zurückzufallen. Das Bearbeiten der englischen Spalte ändert den in der Anwendung angezeigten englischen Text.","Spanish":"Las traducciones se usan tal como están escritas aquí. Deje una celda vacía para volver al inglés. Editar la columna de inglés cambia el texto en inglés mostrado en la aplicación.","Italian":"Le traduzioni vengono usate come scritte qui. Lascia una cella vuota per tornare all’inglese. Modificare la colonna inglese cambia il testo inglese mostrato nell’applicazione.","Dutch":"Vertalingen worden gebruikt zoals hier geschreven. Laat een cel leeg om terug te vallen op Engels. Het bewerken van de Engelse kolom wijzigt de Engelse tekst die in de applicatie wordt getoond.","Portuguese":"As traduções são usadas tal como estão escritas aqui. Deixe uma célula vazia para voltar ao inglês. Editar a coluna de inglês altera o texto em inglês apresentado na aplicação.","Polish":"Tłumaczenia są używane tak, jak są tu zapisane. Pozostaw komórkę pustą, aby wrócić do angielskiego. Edycja kolumny angielskiej zmienia angielski tekst wyświetlany w aplikacji.","Danish":"Oversættelser bruges, som de er skrevet her. Lad en celle være tom for at falde tilbage til engelsk. Redigering af den engelske kolonne ændrer den engelske tekst, der vises i appli Lists (vertaling van de eigen entiteit)","Portuguese":"Admin: Lists (tradução da sua própria entidade)","Polish":"Admin: Lists (tłumaczenie własnej jednostki)","Danish":"Admin: Lists (oversættelse af egen enhed)","Norwegian":"Admin: Lists (oversettelse for egen enhet)"},"Admin: Translation (its own entity)":{"French":"Admin : Translation (sa propre entité)","German":"Admin: Translation (eigene Einheit)","Spanish":"Admin: Translation (su propia entidad)","Italian":"Admin: Translation (propria entità)","Dutch":"Admin: Translation (eigen entiteit)","Portuguese":"Admin: Translation (sua própria entidade)","Polish":"Admin: Translation (własna jednostka)","Danish":"Admin: Translation (egen enhed)","Norwegian":"Admin: Translation (egen enhet)"},"A value can be deleted only if nothing uses it. Otherwise disable it: it stays visible on the objects that use it but can no longer be chosen. Renaming a value also updates the objects that use it. Click Save to apply your changes.":{"French":"Une valeur ne peut être supprimée que si rien ne l'utilise. Sinon, désactivez-la : elle reste visible sur les objets qui l'utilisent mais ne peut plus être choisie. Renommer une valeur met aussi à jour les objets qui l'utilisent. Cliquez sur Save pour appliquer vos modifications.","German":"Ein Wert kann nur gelöscht werden, wenn er nirgends verwendet wird. Andernfalls deaktivieren Sie ihn: Er bleibt bei den Objekten sichtbar, die ihn verwenden, kann aber nicht mehr ausgewählt werden. Das Umbenennen eines Wertes aktualisiert auch die Objekte, die ihn verwenden. Klicken Sie auf Save, um Ihre Änderungen anzuwenden.","Spanish":"Un valor solo se puede eliminar si nada lo utiliza. De lo contrario, desactívelo: seguirá visible en los objetos que lo utilizan pero ya no se podrá elegir. Renombrar un valor también actualiza los objetos que lo utilizan. Haga clic en Save para aplicar sus cambios.","Italian":"Un valore può essere eliminato solo se nulla lo utilizza. Altrimenti disattivalo: resta visibile sugli oggetti che lo usano ma non può più essere scelto. Rinominare un valore aggiorna anche gli oggetti che lo usano. Fai clic su Save per applicare le modifiche.","Dutch":"Een waarde kan alleen worden verwijderd als niets haar gebruikt. Anders kunt u haar uitschakelen: ze blijft zichtbaar op de objecten die haar gebruiken, maar kan niet meer worden gekozen. Het hernoemen van een waarde werkt ook de objecten bij die haar gebruiken. Klik op Save om uw wijzigingen toe te passen.","Portuguese":"Um valor só pode ser eliminado se nada o utilizar. Caso contrário, desative-o: continua visível nos objetos que o utilizam, mas já não pode ser escolhido. Renomear um valor também atualiza os objetos que o utilizam. Clique em Save para aplicar as alterações.","Polish":"Wartość można usunąć tylko wtedy, gdy nic jej nie używa. W przeciwnym razie wyłącz ją: pozostaje widoczna w obiektach, które jej używają, ale nie można jej już wybrać. Zmiana nazwy wartości aktualizuje także obiekty, które jej używają. Kliknij Save, aby zastosować zmiany.","Danish":"En værdi kan kun slettes, hvis intet bruger den. Ellers skal du deaktivere den: den forbliver synlig på de objekter, der bruger den, men kan ikke længere vælges. Omdøbning af en værdi opdaterer også de objekter, der bruger den. Klik på Save for at anvende dine ændringer.","Norwegian":"En verdi kan bare slettes hvis ingenting bruker den. Ellers må du deaktivere den: den forblir synlig på objektene som bruker den, men kan ikke lenger velges. Å endre navn på en verdi oppdaterer også objektene som bruker den. Klikk på Save for å bruke endringene."},"Language of the entity":{"French":"Langue de l'entité","German":"Sprache der Einheit","Spanish":"Idioma de la entidad","Italian":"Lingua dell'entità","Dutch":"Taal van de entiteit","Portuguese":"Idioma da entidade","Polish":"Język jednostki","Danish":"Enhedens sprog","Norwegian":"Enhetens språk"},"Unsaved changes":{"French":"Modifications non enregistrées","German":"Nicht gespeicherte Änderungen","Spanish":"Cambios sin guardar","Italian":"Modifiche non salvate","Dutch":"Niet-opgeslagen wijzigingen","Portuguese":"Alterações não guardadas","Polish":"Niezapisane zmiany","Danish":"Ikke-gemte ændringer","Norwegian":"Ulagrede endringer"},"You have changes that are not saved. Are you sure you want to close without saving?":{"French":"Vous avez des modifications non enregistrées. Voulez-vous vraiment fermer sans enregistrer ?","German":"Sie haben nicht gespeicherte Änderungen. Möchten Sie wirklich schließen, ohne zu speichern?","Spanish":"Tiene cambios sin guardar. ¿Seguro que desea cerrar sin guardar?","Italian":"Hai modifiche non salvate. Vuoi davvero chiudere senza salvare?","Dutch":"U hebt niet-opgeslagen wijzigingen. Weet u zeker dat u wilt sluiten zonder op te slaan?","Portuguese":"Tem alterações não guardadas. Tem a certeza de que quer fechar sem guardar?","Polish":"Masz niezapisane zmiany. Czy na pewno zamknąć bez zapisywania?","Danish":"Du har ændringer, der ikke er gemt. Er du sikker på, at du vil lukke uden at gemme?","Norwegian":"Du har endringer som ikke er lagret. Er du sikker på at du vil lukke uten å lagre?"},"Save and close":{"French":"Enregistrer et fermer","German":"Speichern und schließen","Spanish":"Guardar y cerrar","Italian":"Salva e chiudi","Dutch":"Opslaan en sluiten","Portuguese":"Guardar e fechar","Polish":"Zapisz i zamknij","Danish":"Gem og luk","Norwegian":"Lagre og lukk"},"Yes, close without saving":{"French":"Oui, fermer sans enregistrer","German":"Ja, ohne Speichern schließen","Spanish":"Sí, cerrar sin guardar","Italian":"Sì, chiudi senza salvare","Dutch":"Ja, sluiten zonder opslaan","Portuguese":"Sim, fechar sem guardar","Polish":"Tak, zamknij bez zapisywania","Danish":"Ja, luk uden at gemme","Norwegian":"Ja, lukk uten å lagre"},"Back":{"French":"Retour","German":"Zurück","Spanish":"Volver","Italian":"Indietro","Dutch":"Terug","Portuguese":"Voltar","Polish":"Wstecz","Danish":"Tilbage","Norwegian":"Tilbake"},"Click Save to apply your changes; they take effect for users on their next action.":{"French":"Cliquez sur Save pour appliquer vos modifications ; elles prennent effet pour les utilisateurs à leur prochaine action.","German":"Klicken Sie auf Save, um Ihre Änderungen anzuwenden; sie werden für die Benutzer bei ihrer nächsten Aktion wirksam.","Spanish":"Haga clic en Save para aplicar sus cambios; surten efecto para los usuarios en su próxima acción.","Italian":"Fai clic su Save per applicare le modifiche; hanno effetto per gli utenti alla loro prossima azione.","Dutch":"Klik op Save om uw wijzigingen toe te passen; ze worden voor gebruikers van kracht bij hun volgende actie.","Portuguese":"Clique em Save para aplicar as alterações; produzem efeito para os utilizadores na sua próxima ação.","Polish":"Kliknij Save, aby zastosować zmiany; zaczną obowiązywać użytkowników przy ich następnej akcji.","Danish":"Klik på Save for at anvende dine ændringer; de træder i kraft for brugerne ved deres næste handling.","Norwegian":"Klikk på Save for å bruke endringene; de trer i kraft for brukerne ved neste handling."},"can do everything and has no entity.":{"French":"peut tout faire et n'a pas d'entité.","German":"kann alles tun und hat keine Einheit.","Spanish":"puede hacerlo todo y no tiene entidad.","Italian":"può fare tutto e non ha entità.","Dutch":"kan alles doen en heeft geen entiteit.","Portuguese":"pode fazer tudo e não tem entidade.","Polish":"może wszystko i nie ma jednostki.","Danish":"kan alt og har ingen enhed.","Norwegian":"kan gjøre alt og har ingen enhet."},"Save or discard your pending changes first (Save / Close).":{"French":"Enregistrez ou annulez d'abord vos modifications en attente (Save / Close).","German":"Speichern oder verwerfen Sie zuerst Ihre ausstehenden Änderungen (Save / Close).","Spanish":"Guarde o descarte primero sus cambios pendientes (Save / Close).","Italian":"Salva o annulla prima le modifiche in sospeso (Save / Close).","Dutch":"Sla eerst uw openstaande wijziging const TR={lv:Object.create(null),lsig:'',d:Object.create(null),lang:'English',pat:[],cache:new Map(),active:false,force:false,sig:null};

function trBuild(rows){
  TR.d=Object.create(null);rows.forEach(r=>TR.d[r.key]=r.vals||{});TR.cache.clear();TR.pat=[];
  for(const k in TR.d){if(!/\{\d+\}/.test(k))continue;const parts=k.split(/\{\d+\}/);if(!/[A-Za-z]{3}/.test(parts.join('')))continue;
    const nums=[...k.matchAll(/\{(\d+)\}/g)].map(m=>m[1]);
    TR.pat.push({k,nums,re:new RegExp('^'+parts.map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('(.+?)')+'$','s')})}
  TR.pat.sort((a,b)=>b.k.length-a.k.length);
  TR.active=TR.lang!=='English'||Object.values(TR.d).some(v=>v&&v.English);
}

function trLvOnly(o){if(TR.lang==='English')return o;const c=o.trim(),v=TR.lv[c];return v&&v[TR.lang]?o.replace(c,v[TR.lang]):o}
