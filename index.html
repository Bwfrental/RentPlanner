(function(){
  let pop=null;
  const close=()=>{if(pop){pop.remove();pop=null}};
  function open(sel,init){
    close();
    const r=sel.getBoundingClientRect();
    pop=document.createElement('div');pop.className='ssp';
    pop.innerHTML='<input class="spi" placeholder="Type to search…" autocomplete="off"><div class="spl"></div>';
    document.body.appendChild(pop);
    pop.style.minWidth=Math.max(160,r.width)+'px';pop.style.left=Math.min(r.left,innerWidth-pop.offsetWidth-8)+'px';
    const below=innerHeight-r.bottom,top=below<290&&r.top>below?Math.max(4,r.top-pop.offsetHeight-300+pop.offsetHeight):r.bottom+2;
    pop.style.top=(below<290&&r.top>below?Math.max(4,r.top-Math.min(300,pop.offsetHeight+240)-2):r.bottom+2)+'px';
    const inp=pop.querySelector('input'),lst=pop.querySelector('.spl');let items=[],hi=0;
    const draw=()=>{const q=inp.value.toLowerCase().trim();
      items=[...sel.options].filter(o=>!o.disabled&&(o.text||'').toLowerCase().includes(q));
      const ci=items.findIndex(o=>o.value===sel.value);if(hi>=items.length||hi<0)hi=Math.max(0,ci);
      lst.innerHTML=items.map((o,i)=>`<div data-i="${i}" class="${i===hi?'hi':''}${o.value===sel.value?' cur':''}">${(o.text||'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`).join('')||'<div class="none">No match</div>';
      const h=lst.querySelector('.hi');if(h)h.scrollIntoView({block:'nearest'})};
    const pick=i=>{const o=items[i];if(!o)return;sel.value=o.value;close();sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}));sel.focus()};
    inp.value=init||'';hi=-1;draw();inp.focus();
    inp.addEventListener('input',()=>{hi=0;draw()});
    inp.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(items.length-1,hi+1);draw()}
      else if(e.key==='ArrowUp'){e.preventDefault();hi=Math.max(0,hi-1);draw()}
      else if(e.key==='Enter'){e.preventDefault();pick(hi)}
      else if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();close();sel.focus()}});
    lst.addEventListener('mousedown',e=>{e.preventDefault();const d=e.target.closest('[data-i]');if(d)pick(+d.dataset.i)});
    pop.addEventListener('click',e=>e.stopPropagation());
  }
  const ok=s=>s&&s.tagName==='SELECT'&&!s.multiple&&!s.disabled&&s.size<=1&&!s.closest('[data-nosp]');
  document.addEventListener('mousedown',e=>{
    if(pop&&pop.contains(e.target))return;
    const s=e.target.closest&&e.target.closest('select');
    if(ok(s)){e.preventDefault();const was=pop&&pop._for===s;close();if(!was){s.focus();open(s);pop._for=s}}
    else close();
  },true);
  document.addEventListener('keydown',e=>{
    const s=e.target;if(!ok(s)||pop)return;
    if(['Enter',' ','ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();open(s);pop._for=s}
    else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();open(s,e.key);pop._for=s}
  },true);
  addEventListener('resize',close);addEventListener('scroll',e=>{if(pop&&!pop.contains(e.target))close()},true);
})();

function wrRows(){
  const out=[];

    const past=ls.filter(l=>l.end_date<=TODAY).sort((x,y)=>x.end_date<y.end_date?1:-1)[0];  // previous project (End date reached)
    if(!past)return;
    if(ls.some(l=>l.id!==past.id&&l.delivery_date<=TODAY&&l.end_date>=TODAY))return;       // currently on another project
    if(ls.some(l=>l.id!==past.id&&l.delivery_date<=past.end_date&&l.end_date>=past.end_date))return;
    const p=S.PJ[past.project_id];

    out.push({a,l:past,p});

  return out.sort((x,y)=>x.l.end_date<y.l.end_date?-1:1);
}

  const o=S.L.filter(x=>x.asset_id===l.asset_id&&x.id!==l.id);
  if(f==='transfer_from_prev'){const pv=o.filter(x=>x.end_date<l.delivery_date).sort((a,b)=>a.end_date<b.end_date?1:-1)[0];
    if(!pv)return'There is no previous project on this asset.';if(S.PJ[pv.project_id]?.project_type!=='Rental')return'The previous project is not a Rental project: transfer not possible.';if(pv.workshop_return)return'A return to the workshop is confirmed on the previous project: transfer not possible.'}
  else{if(l.workshop_return)return'A return to the workshop is confirmed on this project: transfer to the next project not possible.';const nx=o.filter(x=>x.delivery_date>l.end_date).sort((a,b)=>a.delivery_date<b.delivery_date?-1:1)[0];
    if(!nx)return'There is no upcoming project on this asset.';if(S.PJ[nx.project_id]?.project_type!=='Rental')return'The next project is not a Rental project: transfer not possible.'}
  return'';
}
function askCol(i){
  pushModal();
  $('#modal').innerHTML=`<div class="box" style="max-width:420px"><h2>Collection date</h2><p class="inf">The Delivery date will be confirmed. You can enter the date on which the asset is collected at the workshop (optional, on or before the Delivery date).</p><label style="display:grid;gap:3px">Collection date at the workshop (optional) <input type="date" id="cld" max="${S.ed.lines[i].delivery_date}" value="${S.ed.lines[i].collection_date||''}"></label><div class="bt"><button class="p" data-cl="${i}">Confirm</button><button id="cx">Cancel</button></div></div>`;
}
function askWs(i){
  pushModal();
  $('#modal').innerHTML=`<div class="box" style="max-width:420px"><h2>Returned to…</h2><p class="inf">Choose the workshop where the asset returns. The End date will be confirmed.</p><label>Workshop <select id="rtw">${optH(lk('workshop').map(x=>[x,x]),S.ed.lines[i].returned_to||'')}</select></label><label style="display:grid;gap:3px;margin-top:8px">Return date at the workshop (optional) <input type="date" id="rtd" min="${S.ed.lines[i].end_date}" value="${S.ed.lines[i].return_date||''}"></label><div class="bt"><button class="p" data-rt="${i}">Confirm</button><button id="cx">Cancel</button></div></div>`;
}
const gofL=l=>l.delivery_date>TODAY?0:l.end_date<TODAY?2:1;
const edPT=()=>S.ed.p?S.ed.p.project_type:S.ed.v.project_type,edCan=l=>canLines({project_type:edPT(),project_manager_id:S.ed.v.project_manager_id},l),
  edRm=l=>!l.id||isAdm(S.me)||(can('project_lines')&&ptOK(edPT())&&(S.AM[l.asset_id]?.entity_id===S.me.entity_id||(isExt(S.AM[l.asset_id])&&!!S.me.entity_id&&edOwnEnt()===S.me.entity_id))),
  edExt=a=>isExt(a)&&!!S.me.entity_id&&edOwnEnt()===S.me.entity_id,
  edBk=b=>isAdm(S.me)||(can('project_edit')&&ptOK(edPT())&&!!b.entity_id&&b.entity_id===S.me.entity_id),
  edOwnEnt=()=>S.U.find(u=>u.id===S.ed.v.project_manager_id)?.entity_id||null,
  edApproved=()=>{const a=new Set(S.ed.v.approved||[]),o=edOwnEnt();if(o)a.add(o);(S.ed.blocks||[]).forEach(b=>b.entity_id&&a.add(b.entity_id));return[...a]};
const blkIdx=g=>S.ed.lines.map((l,i)=>({l,i})).filter(x=>!x.l._del&&gofL(x.l)===g&&edCan(x.l));
function tglOne(i,f,want,ws,dt){   // same rules as tgl(), for one line; returns an error message or ''
  const l=S.ed.lines[i],rental=S.ed.v.project_type==='Rental';
  if(!!l[f]===want)return'';
  if(f==='transfer_from_prev'||f==='transfer_to_next'){if(!rental)return'';if(want){const er=trCheck(l,f);if(er)return er}l[f]=want;return''}
  if(f==='end_confirmed'&&rental){
    if(!want){l.end_confirmed=false;l.workshop_return=false;l.returned_to='';l.return_date='';return''}
    if(l.transfer_to_next){l.end_confirmed=true;return''}
    if(dt&&dt<l.end_date)return`The return date (${fr(dt)}) must be on or after the End date (${fr(l.end_date)}).`;
    l.returned_to=ws;l.return_date=dt||'';l.end_confirmed=true;return''}
  if(f==='delivery_confirmed'&&rental){
    if(!want){l.delivery_confirmed=false;l.collection_date='';return''}
    if(dt&&dt>l.delivery_date)return`The collection date (${fr(dt)}) must be on or before the Delivery date (${fr(l.delivery_date)}).`;
    l.delivery_confirmed=true;l.collection_date=dt||'';return''}
  if(f==='workshop_return'){
    if(!want){l.workshop_return=false;return''}
    if(l.transfer_to_next)return'A transfer to the next project exists on this asset: no return to the workshop possible.';
    if(l.end_date>TODAY)return'The return cannot be confirmed before the End date (it is in the future).';
    if(!l.end_confirmed)return'Confirm the End date first (✓ on the End date, where you choose the return workshop).';
    if(!l.returned_to)return'No return workshop on this line: untick the End date ✓ in the project and tick it again to choose the workshop.';
    l.workshop_return=true;return''}
  l[f]=want;return'';
}
function bulkReport(ok,n,errs){
  if(!errs.length){if(!n)toast('Nothing to change.');return}
  toastH(`<div>Applied to ${ok} of ${n} asset(s). Not applied:</div>`+errs.slice(0,6).map(([a,m])=>`<div><b>${esc(a)}</b> <span>${esc(m)}</span></div>`).join('')+(errs.length>6?`<div>+${errs.length-6} …</div>`:''));
}
function bulkApply(g,f,want,ws,dt){
  const idx=blkIdx(g),errs=[];let ok=0,n=0;
  idx.forEach(({l,i})=>{if(!!l[f]===want)return;n++;const er=tglOne(i,f,want,ws,dt);if(er)errs.push([S.AM[l.asset_id]?.name||'',er]);else ok++});
  draw();bulkReport(ok,n,errs);
}
function bulk(arg){
  const[g,kind,f]=arg.split('|'),G=+g,idx=blkIdx(G);if(!idx.length)return;
  if(kind==='cal'){pushModal();$('#modal').innerHTML=`<div class="box" style="max-width:380px"><h2>Change date</h2><p class="inf">Select the date to apply to all the assets of this block:</p><input type="date" id="bkd"><div class="bt"><button class="p" data-bkd="${G}|${f}">Apply</button><button id="cx">Cancel</button></div></div>`;return}
  const want=!idx.every(x=>!!x.l[f]);
  if(f==='end_confirmed'&&want&&S.ed.v.project_type==='Rental'&&idx.some(x=>!x.l.end_confirmed&&!x.l.transfer_to_next)){
    pushModal();$('#modal').innerHTML=`<div class="box" style="max-width:420px"><h2>Returned to…</h2><p class="inf">Choose the workshop where the assets return. The End date will be confirmed.</p><label>Workshop <select id="rtw">${optH(lk('workshop').map(x=>[x,x]),'')}</select></label><label style="display:grid;gap:3px;margin-top:8px">Return date at the workshop (optional, applied to all the assets) <input type="date" id="rtd"></label><div class="bt"><button class="p" data-rtb="${G}">Confirm</button><button id="cx">Cancel</button></div></div>`;return}
  if(f==='delivery_confirmed'&&want&&S.ed.v.project_type==='Rental'&&idx.some(x=>!x.l.delivery_confirmed)){
    pushModal();$('#modal').innerHTML=`<div class="box" style="max-width:420px"><h2>Collection date</h2><p class="inf">The Delivery dates will be confirmed. You can enter the date on which the assets are collected at the workshop (optional, on or before each Delivery date).</p><label style="display:grid;gap:3px">Collection date at the workshop (optional) <input type="date" id="cld"></label><div class="bt"><button class="p" data-clb="${G}">Confirm</button><button id="cx">Cancel</button></div></div>`;return}
  bulkApply(G,f,want,'');
}
function bulkDate(g,f,d){
  const idx=blkIdx(g),errs=[],V=S.ed.v;let ok=0,n=0;
  idx.forEach(({l})=>{n++;const nd=f==='delivery_date'?d:l.delivery_date,ne=f==='end_date'?d:l.end_date,a=S.AM[l.asset_id],nm=a?.name||'';let er='';
    if(ne<=nd)er='The End date must be after the Delivery date';
    else if((V.project_type==='Rental'||V.project_type==='Maintenance')&&a&&nd<=a.manufacture_date)er=`The delivery date of ${nm} (${fr(nd)}) must be after its manufacture date (${fr(a.manufacture_date)}).`;
    else if(l.inspection_date&&l.inspection_date>ne)er='The inspection date cannot be after the End date.';
    else if(f==='delivery_date'&&l.collection_date&&l.collection_date>nd)er=`The collection date (${fr(l.collection_date)}) must be on or before the Delivery date.`;
    else if(f==='end_date'&&l.return_date&&l.return_date<ne)er=`The return date (${fr(l.return_date)}) must be on or after the End date.`;
    if(er){errs.push([nm,er]);return}
    l[f]=d;if(f==='end_date'&&d>TODAY&&l.workshop_return)l.workshop_return=false;ok++});
  draw();bulkReport(ok,n,errs);
}
function tgl(t){
  const l=S.ed.lines[t.dataset.tg],f=t.dataset.f;if(t.classList.contains('off'))return;
  if((f==='transfer_from_prev'||f==='transfer_to_next')&&!l[f]){const er=trCheck(l,f);if(er)return toast(er)}
  if(f==='end_confirmed'&&S.ed.v.project_type==='Rental'){
    if(l.end_confirmed){l.end_confirmed=false;l.workshop_return=false;l.returned_to='';l.return_date='';draw();return}   // un-confirming the End date also cancels the return
    if(!l.transfer_to_next)return askWs(t.dataset.tg)}
  if(f==='delivery_confirmed'&&S.ed.v.project_type==='Rental'){
    if(l.delivery_confirmed){l.delivery_confirmed=false;l.collection_date='';draw();return}
    return askCol(t.dataset.tg)}
  if(f==='workshop_return'){if(l[f]){l[f]=false;draw();return}if(l.transfer_to_next)return toast('A transfer to the next project exists on this asset: no return to the workshop possible.');if(l.end_date>TODAY)return toast('The return cannot be confirmed before the End date (it is in the future).');
    if(!l.end_confirmed)return toast('Confirm the End date first (✓ on the End date, where you choose the return workshop).');
    if(!l.returned_to)return toast('No return workshop on this line: untick the End date ✓ and tick it again to choose the workshop.');
    l.workshop_return=true;draw();return}
  l[f]=!l[f];draw();
}
async function save(){
  const{p,v,lines}=S.ed;v.project_name=v.project_name.trim().toUpperCase();v.location_name=normLoc(v.location_name.trim());
  if(!v.project_name||!v.location_name.trim())return toast('Name and location/client are required.');
  if(SINGLE.includes(v.project_type)&&!(lk('workshop').includes(v.location_name)||(p&&p.location_name===v.location_name)))return toast('Choose the workshop in the list.');
  {const c=lines.find(l=>!l._del&&l.collection_date&&l.collection_date>l.delivery_date);if(c)return toast(`${S.AM[c.asset_id]?.name||'Asset'}: the collection date must be on or before the Delivery date.`);
   const r=lines.find(l=>!l._del&&l.return_date&&l.return_date<l.end_date);if(r)return toast(`${S.AM[r.asset_id]?.name||'Asset'}: the return date must be on or after the End date.`)}
  const bd=lines.find(l=>!l._del&&l.end_date<=l.delivery_date);if(bd)return toast(`The End date must be after the Delivery date (${S.AM[bd.asset_id]?.name||'asset'}).`);
  if(v.project_type==='Rental'||v.project_type==='Maintenance'){const b=lines.find(l=>!l._del&&S.AM[l.asset_id]&&l.delivery_date<=S.AM[l.asset_id].manufacture_date);
    if(b)return toast(`The delivery date of ${S.AM[b.asset_id].name} (${fr(b.delivery_date)}) must be after its manufacture date (${fr(S.AM[b.asset_id].manufacture_date)}).`)}
  if(v.project_type==='In production'){
    const b=lines.find(l=>!l._del&&S.L.some(x=>x.asset_id===l.asset_id&&x.id!==l.id&&x.project_id!==p?.id&&S.PJ[x.project_id]?.project_type==='In production'));
    if(b)return toast(`${S.AM[b.asset_id].name} has already been on an In production project: it can be produced only once.`);
    const c=lines.find(l=>!l._del&&S.L.some(x=>x.asset_id===l.asset_id&&['Rental','Maintenance'].includes(S.PJ[x.project_id]?.project_type)&&x.delivery_date<=l.end_date));
    if(c)return toast(`The end date of the In production project (${fr(c.end_date)}) becomes the manufacture date of ${S.AM[c.asset_id].name}: it must be before all its delivery dates.`)}
  if(v.project_type==='Rental'||v.project_type==='Maintenance'){const b=lines.map(l=>l._del?'':prevBlock(l.asset_id,l.delivery_date,v.project_type,l.transfer_from_prev,p?.id)).find(Boolean);if(b)return toast(b)}
  const cE=!p?true:canOwn(p)&&can('project_edit')&&ptOK(p.project_type),tr=v.project_type==='Rental';
  if(cE&&v.project_type==='Maintenance'&&String(v.cost??'').trim()!==''&&!/^\d+$/.test(String(v.cost).trim()))return toast('The cost must be a whole number of euros (0 or more).');
  if(S.ed.blocks.some(b=>edBk(b)&&(!b.project_name.trim()||!b.commercial_area||!b.project_manager_id)))return toast('Other assets owner: the project name, the commercial area and the project manager are required.');
  {const bi=lines.find(l=>!l._del&&l.inspection_date&&l.inspection_date>l.end_date);if(bi)return toast('The inspection date of '+(S.AM[bi.asset_id]?.name||'an asset')+' cannot be after its End date.')}
  const pl=lines.filter(l=>!(l._del&&!l.id)).filter(l=>l._del?edRm(l):edCan(l)).map(l=>l._del?{id:l.id,_del:true}:{id:l.id||null,version:l.version||null,asset_id:l.asset_id,delivery_date:l.delivery_date,end_date:l.end_date,
    delivery_confirmed:!!l.delivery_confirmed,end_confirmed:!!l.end_confirmed,comments:l.comments||null,transfer_from_prev:tr&&!!l.transfer_from_prev,transfer_to_next:tr&&!!l.transfer_to_next,workshop_return:tr&&!!l.workshop_return,returned_to:tr?(l.returned_to||null):null,collection_date:tr&&l.delivery_confirmed?(l.collection_date||null):null,return_date:tr&&l.end_confirmed?(l.return_date||null):null,inspection_status:tr?(l.inspection_status||'to_plan'):'to_plan',inspection_date:tr?(l.inspection_date||null):null,inspector:tr?(l.inspector||null):null,inspection_comment:tr?(l.inspection_comment||null):null});
  // one database transaction: if anything fails, nothing is created or changed (and nothing is logged)
  const{error}=await sb.rpc('save_project',{p_id:p?.id||null,p:cE?{base_name:v.project_name,project_type:v.project_type,commercial_area:v.commercial_area,project_manager_id:v.project_manager_id,location_name:v.location_name,comments:v.comments||null,approved_entities:edApproved(),cost:v.project_type==='Maintenance'&&String(v.cost??'').trim()!==''?Number(v.cost):null}:null,p_version:p?.version??null,p_lines:pl,p_blocks:S.ed.blocks.map((b,i)=>({b,i})).filter(x=>edBk(x.b)).map(({b,i})=>({entity_id:b.entity_id,pos:i+1,project_name:b.project_name.trim().toUpperCase(),commercial_area:b.commercial_area,project_manager_id:b.project_manager_id,comments:b.comments||null}))});
  if(error){
    if((error.message||'').includes('STALE')){toast('Modified in the meantime by someone else: data reloaded, please check and retry.');return load()}
    if(error.code==='23P01'){const o=lines.find(l=>!l._del&&S.L.some(x=>x.asset_id===l.asset_id&&x.project_id!==p?.id&&x.delivery_date<=l.end_date&&l.delivery_date<=x.end_date));if(o)return toastOv(o.asset_id,o.delivery_date,o.end_date,o.id)}
    return toast(msg(error));
  }
  const qn=S.ed.qaNew,pid=p?.id;
  const qaWas=qaOn();
  closeModal();toast('Saved.');
  if(qn&&pid&&v.project_type==='Maintenance'&&qaWas){const r=await sb.rpc('set_quality_audit',{p_project:pid,p_status:qn.status,p_date:qn.audit_date,p_comment:qn.comment||null});if(r.error)toast('Project saved, but the quality audit was not updated: '+msg(r.error));else(S.QA??={})[pid]={project_id:pid,status:qn.status,audit_date:qn.audit_date,comment:qn.comment}}
  load();
}
</script></body></html>
